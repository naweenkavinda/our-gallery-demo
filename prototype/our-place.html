<style>
/* Layout: an isometric living city fills the screen; a cream status pill and round tool buttons float at the top, a build drawer and info sheets slide up from the bottom. One soft daylight look, with a purple glow at night. */
:root{
  --cream:#f7f2e6; --cream-2:#efe7d6; --cream-3:#e6dcc7; --line:#e1d6c0;
  --ink:#3b322c; --muted:#8c8072; --green:#5d8b57; --coral:#d4685a; --gold:#e8b44a; --plum:#3b2f5c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:#cfdcc0;color:var(--ink);font-family:var(--body);overflow:hidden;}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
#game.placing{cursor:crosshair;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.panel{background:color-mix(in srgb,var(--cream) 96%,transparent);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgb(60 45 30/.18);}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;}

/* top */
.top{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
.top>*{pointer-events:auto;}
.status{display:flex;align-items:center;gap:14px;padding:8px 18px 8px 12px;border-radius:999px;}
.coins{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:26px;line-height:1;}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe39a,#e2a93a 60%,#c58b25);box-shadow:inset 0 -2px 0 rgb(0 0 0/.12);flex:none;}
.rate{font-family:var(--body);font-size:12px;font-weight:800;color:var(--green);margin-left:2px;}
.sep{width:1px;align-self:stretch;background:var(--line);}
.when{display:grid;gap:1px;}
.when .d{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);}
.when .w{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:16px;}
.when svg{width:18px;height:18px;}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--cream);border:1px solid var(--line);box-shadow:0 6px 16px rgb(60 45 30/.16);padding:0;}
.round svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.round[aria-pressed=true]{background:var(--ink);}
.round[aria-pressed=true] svg{stroke:var(--cream);}
.coords{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));background:rgb(239 231 214/.85);border-radius:12px;padding:6px 10px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted);}

/* bottom */
.bottom{position:fixed;z-index:6;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));}
.bottom>*{pointer-events:auto;width:min(560px,100%);box-sizing:border-box;}
.hint{justify-self:center;width:auto!important;max-width:min(560px,100%);background:rgb(247 242 230/.88);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-align:center;line-height:1.35;}
.dock{display:flex;gap:8px;align-items:center;}
.live{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;font-weight:800;font-size:14px;flex:1;min-width:0;}
.live .who{color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none;box-shadow:0 0 0 4px rgb(212 104 90/.18);}
.dark{background:var(--ink);color:var(--cream);border:0;border-radius:16px;padding:12px 20px;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:0 8px 18px rgb(59 50 44/.3);}
.dark[disabled]{opacity:.45;cursor:not-allowed;}
.soft{background:var(--cream-2);border:0;border-radius:16px;padding:12px 18px;font-family:var(--display);font-weight:600;font-size:17px;}
.sheet{padding:18px;display:grid;gap:12px;max-height:min(70vh,640px);overflow:auto;}
.sheet-head{display:flex;align-items:flex-start;gap:12px;}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance;}
.sheet-head .sub{color:var(--muted);font-weight:700;font-size:16px;margin-top:2px;}
.x{margin-left:auto;background:none;border:0;padding:6px;line-height:0;}
.x svg{width:22px;height:22px;stroke:var(--ink);stroke-width:2;stroke-linecap:round;}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:inset 0 -6px 0 rgb(0 0 0/.12);}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.tile{background:var(--cream-2);border-radius:16px;padding:10px 12px;display:grid;gap:2px;min-width:0;}
.tile .k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.tile .v{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;}
.tile .s{font-size:13px;font-weight:700;color:var(--muted);}
.tile .s.g{color:var(--green);}
.rows{display:grid;}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;}
.rows div span:first-child{color:var(--muted);font-weight:700;}
.rows div span:last-child{font-weight:800;text-align:right;}
.bar{height:12px;background:var(--cream-3);border-radius:999px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:999px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}
.btnrow>*{flex:1;}

/* build drawer */
.drawer{padding:12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;}
.modes{display:grid;gap:8px;align-content:start;}
.modes button{width:74px;border:2px solid transparent;background:var(--cream-2);border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:4px;font-weight:800;font-size:13px;}
.modes button svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.modes button[aria-pressed=true]{border-color:var(--coral);background:var(--cream);}
.cats{display:flex;gap:4px;overflow-x:auto;background:var(--cream-2);border-radius:999px;padding:4px;scrollbar-width:none;}
.cats button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);white-space:nowrap;}
.cats button[aria-pressed=true]{background:var(--ink);color:var(--cream);}
.cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x mandatory;}
.card{flex:0 0 132px;scroll-snap-align:start;border:2px solid transparent;background:var(--cream);border-radius:16px;padding:6px 8px 10px;display:grid;justify-items:center;gap:2px;text-align:center;box-shadow:0 3px 0 var(--cream-3);}
.card canvas{width:116px;height:66px;}
.card b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;}
.card .p{font-weight:800;color:var(--muted);font-size:14px;}
.card[aria-pressed=true]{border-color:var(--coral);}
.card[disabled]{opacity:.45;cursor:not-allowed;}
.card .lock{font-size:11px;font-weight:800;color:var(--coral);}
.right{display:grid;gap:8px;min-width:0;}

/* toasts */
#toast{position:fixed;z-index:9;top:calc(126px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:6px;pointer-events:none;justify-items:center;}
#toast div{background:var(--ink);color:var(--cream);border-radius:999px;padding:8px 16px;font-weight:800;animation:pop .25s ease-out;box-shadow:0 8px 20px rgb(0 0 0/.2);white-space:nowrap;}
#toast .plus{color:#ffd77a;font-family:var(--display);}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}

/* login */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgb(59 47 92/.35);backdrop-filter:blur(3px);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;}
.welcome{width:min(460px,100%);padding:24px;display:grid;gap:14px;box-sizing:border-box;}
.welcome h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(40px,9vw,56px);line-height:.95;}
.welcome p{margin:0;color:var(--muted);font-weight:600;line-height:1.5;}
label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
input[type=text]{width:100%;box-sizing:border-box;background:var(--cream-2);border:2px solid transparent;border-radius:16px;padding:12px 14px;color:var(--ink);font:700 19px var(--body);}
input[type=text]:focus{border-color:var(--gold);outline:none;}
.swatches{display:flex;flex-wrap:wrap;gap:10px;}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid var(--cream);box-shadow:0 0 0 2px var(--line);}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink);}
.note{font-size:13px;color:var(--muted);font-weight:700;}
#mini{display:block;width:100%;aspect-ratio:1;max-width:320px;justify-self:center;border-radius:16px;cursor:pointer;}
@media (max-width:520px){
  .coins{font-size:22px;}
  .round{width:42px;height:42px;}
  .coords{display:none;}
  .card{flex-basis:118px;}
  .card canvas{width:104px;height:60px;}
  .modes button{width:64px;}
}
@media (prefers-reduced-motion:reduce){#toast div{animation:none;}}
</style>

</div>

</div>

function hash2(x,y,s){ let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041); h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function hashStr(str){ let h=2166136261; for (let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function vnoise(x,y,s){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y,s){ let t=0,a=.5,f=1; for (let i=0;i<4;i++){ t+=a*vnoise(x*f,y*f,s+i*31); f*=2; a*=.5; } return t/.9375; }

const biome=new Uint8Array(W*H), water=new Uint8Array(W*H), deco=new Uint8Array(W*H), shade=new Float32Array(W*H), road=new Uint8Array(W*H);

(function genTerrain(){
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x;
    const wx=x+(fbm(x/38,y/38,SEED)-.5)*46, wy=y+(fbm(x/38+50,y/38+50,SEED+1)-.5)*46;
    const b = wx<W*.37 ? 0 : (wy<H*.5 ? 1 : 2);
    biome[i]=b; shade[i]=fbm(x/9,y/9,SEED+5);
    const dTown=Math.hypot(x-TOWN.x,y-TOWN.y), wn=fbm(x/24,y/24,SEED+9);
    if (dTown>26 && x>2 && y>2 && x<W-3 && y<H-3){
      if (b===1 && wn<.25) water[i]=1; else if (b===2 && wn<.17) water[i]=1; else if (b===0 && fbm(x/14,y/14,SEED+12)<.13) water[i]=1;
    }
    if (water[i] || dTown<14) continue;
    const r=hash2(x,y,SEED+3), dense=fbm(x/16,y/16,SEED+4);
    if (b===1){ if (r<.12+dense*.38) deco[i]= r<.22?5:1; else if (r>.97) deco[i]=4; }
    else if (b===0){ if (r<.035) deco[i]=2; else if (r<.07) deco[i]=4; else if (r<.085) deco[i]=1; }
    else { if (r<.028) deco[i]=3; else if (r<.04) deco[i]=2; else if (r<.046) deco[i]=6; }
  }
})();

function rebuildCity(){
  occ.fill(-1); nearB.fill(0);
  S.buildings.forEach((b,idx)=>{ const [w,h]=TYPES[b.type].size;
    for (let y=b.y-1;y<=b.y+h;y++) for (let x=b.x-1;x<=b.x+w;x++) if (inMap(x,y)){ nearB[y*W+x]=1; if (x>=b.x&&x<b.x+w&&y>=b.y&&y<b.y+h) occ[y*W+x]=idx; } });
  npcs=[];
  for (const hb of S.buildings) for (let k=0;k<(TYPES[hb.type].residents||0) && npcs.length<160;k++){
    const id="npc-"+hb.id+"-"+k; npcs.push({id, home:hb, name:NPC_NAMES[hashStr(id)%NPC_NAMES.length], color:NPC_COLORS[hashStr(id+"c")%NPC_COLORS.length]});
  }
  destCache=new Map(); chunkCache.clear(); overviewDirty=true;
}
function rebuildRoads(){
  road.set(starterRoad);
  for (const key in S.dbRoads){ const m=/^r_(\d+)_(\d+)$/.exec(key); if (!m) continue; const cx=+m[1],cy=+m[2];
    for (const li of S.dbRoads[key]){ const x=cx*CH+li%CH, y=cy*CH+Math.floor(li/CH); if (inMap(x,y)) road[y*W+x]=1; } }
  // roads never run through buildings or water
  for (let i=0;i<W*H;i++) if (occ[i]>=0||water[i]) road[i]=0;
  lamps=[]; roadList=[];
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const i=y*W+x; if (!road[i]) continue; roadList.push(i);
    if (hash2(x,y,404)<.14){ const edge = !(y>0&&road[i-W]) ? 0 : !(y<H-1&&road[i+W]) ? 1 : !(x>0&&road[i-1]) ? 2 : !(x<W-1&&road[i+1]) ? 3 : -1; if (edge>=0) lamps.push({x,y,edge}); } }
  fireCache=new Map();
  chunkCache.clear(); overviewDirty=true;
}
function setBuildings
(list){
  const starters=STARTER.map(([id,type,dx,dy])=>({id,type,x:TOWN.x+dx,y:TOWN.y+dy,by:null,starter:true}));
  const seen=new Set(), valid=[];
  for (const b of list){ if (!TYPES[b.type]||TYPES[b.type].starter) continue; if (!Number.isInteger(b.x)||!Number.isInteger(b.y)||!inMap(b.x,b.y)) continue; if (seen.has(b.id)) continue; seen.add(b.id); valid.push(b); }
  valid.sort((a,b)=>(a.at||0)-(b.at||0)||(a.id<b.id?-1:1));
  S.buildings=starters.concat(valid); rebuildCity(); rebuildRoads();
}

/* bonus: places to relax nearby (service radius) + road access */
function bonusFor(b){
  const t=TYPES[b.type],[w,h]=t.size,cx=b.x+w/2,cy=b.y+h/2; let leisure=0, roadOk=false;
  for (const o of S.buildings){ if (o===b||!TYPES[o.type].leisure) continue; const ot=TYPES[o.type]; if (Math.hypot(o.x+ot.size[0]/2-cx,o.y+ot.size[1]/2-cy)<=10) leisure++; }
  for (let x=b.x-1;x<=b.x+w&&!roadOk;x++) for (let y=b.y-1;y<=b.y+h;y++){ if (inMap(x,y)&&road[y*W+x]&&(x<b.x||x>=b.x+w||y<b.y||y>=b.y+h)){ roadOk=true; break; } }
  return {pct:Math.min(30,leisure*5)+(roadOk?10:0), leisure, roadOk};
}

function candidatesFor(id,home){
  let c=destCache.get(id); if (c) return c;
  c=S.buildings.map(b=>{ const t=TYPES[b.type]; return {b,d:Math.hypot(b.x+t.size[0]/2-home.x,b.y+t.size[1]/2-home.y)+hash2(hashStr(id)&65535,hashStr(b.id)&65535,3)*14}; }).sort((a,b)=>a.d-b.d).slice(0,12).map(s=>s.b);
  destCache.set(id,c); return c;
}
function door(b){ const t=TYPES[b.type]; return {x:(b.x+t.size[0]/2)*T, y:(b.y+t.size[1])*T+6}; }
function destAt(id,home,k){ const c=candidatesFor(id,home); return c.length ? c[Math.floor(hash2(hashStr(id)&0xffffff,k,11)*c.length)] : null; }
function autoState(id,home,now){
  const k=Math.floor(now/SLOT), a=destAt(id,home,k-1), b=destAt(id,home,k);
  if (!a||!b) return {x:home.x*T,y:home.y*T,act:null};
  const p0=door(a),p1=door(b),el=(now-k*SLOT)/1000*WALK,dx=p1.x-p0.x,dy=p1.y-p0.y,d=Math.abs(dx)+Math.abs(dy);
  if (el>=d){ const t=TYPES[b.type], night=nightAmount(gameTime(now).frac)>.5 && t.residents; return {x:p1.x+Math.sin(now/900+hashStr(id))*3,y:p1.y,act:(night?"Asleep":t.verb)+" at "+t.name,b,walking:false}; }
  if (el<Math.abs(dx)) return {x:p0.x+Math.sign(dx)*el,y:p0.y,act:null,walking:true};
  return {x:p1.x,y:p0.y+Math.sign(dy)*(el-Math.abs(dx)),act:null,walking:true};
}

function screenToIso(sx,sy){ const c=S.cam; return {x:c.x+(sx-innerWidth/2)/c.z, y:c.y+(sy-innerHeight/2)/c.z}; }
function isoToWorld(ix,iy){ return {x:(ix+2*iy)/2, y:(2*iy-ix)/2}; }
function screenToWorld(sx,sy){ const p=screenToIso(sx,sy); return isoToWorld(p.x,p.y); }
function worldToScreen(wx,wy){ const c=S.cam; return {x:(isoX(wx,wy)-c.x)*c.z+innerWidth/2, y:(isoY(wx,wy)-c.y)*c.z+innerHeight/2}; }

function shadeHex(hex,k){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(v*k))); return "rgb("+f(n>>16)+","+f((n>>8)&255)+","+f(n&255)+")"; }
function poly(g,pts,fill){ g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for (let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fillStyle=fill; g.fill(); }

const GROUND=[["#d3c7a2","#cbbe97","#dbd0ae"],["#a9c493","#a1bd8a","#b2cb9c"],["#ecdcb5","#e6d4aa","#f1e3c1"]];
const groundColor=i=>{ const g=GROUND[biome[i]], s=shade[i]; return s<.42?g[1]:(s>.6?g[2]:g[0]); };
const PAD=48;
const chunkCache=new Map();
function getChunk(cx,cy,res){
  const key=cx+","+cy+","+res; let c=chunkCache.get(key);
  if (c){ chunkCache.delete(key); chunkCache.set(key,c); return c; }
  c=document.createElement("canvas"); c.width=2*CH*T*res; c.height=(CH*T+PAD)*res;
  const g=c.getContext("2d"); g.scale(res,res);
  const [ox,oy]=P(cx*CH,cy*CH); g.translate(-(ox-CH*T), -(oy-PAD));
  drawChunk(g,cx,cy);
  chunkCache.set(key,c);
  let n=0; for (const k of chunkCache.keys()) if (k.endsWith(","+res)) n++;
  if (n>(res===2?28:90)) for (const k of chunkCache.keys()) if (k.endsWith(","+res)){ chunkCache.delete(k); break; }
  return c;
}
function tileDiamond(x,y){ return [P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)]; }
function drawChunk(g,cx,cy){
  const x0=cx*CH,y0=cy*CH;
  for (let ly=0;ly<CH;ly++) for (let lx=0;lx<CH;lx++){
    const x=x0+lx,y=y0+ly,i=y*W+x,d=tileDiamond(x,y);
    if (water[i]){ poly(g,d, biome[i]===2?"#9fd3cf":"#a8c6df");
      if (hash2(x,y,77)<.2){ const c=P(x+.5,y+.5); g.fillStyle="rgba(255,255,255,.5)"; g.fillRect(c[0]-4,c[1],8,1); }
      continue; }
    poly(g,d,groundColor(i));
    if (road[i]) drawRoadTile(g,x,y,i);
    else if (biome[i]===2 && (x+y*3)%7===0){ const a=P(x+.15,y+.5), b=P(x+.85,y+.5); g.strokeStyle="rgba(190,150,90,.25)"; g.lineWidth=1; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
    else if (biome[i]!==2 && hash2(x,y,21)<.05){ const c=P(x+.5,y+.5); g.fillStyle=["#e4a3b8","#f0d27a","#c7b3e6"][hash2(x,y,22)*3|0]; g.beginPath(); g.ellipse(c[0],c[1],5,2.5,0,0,7); g.globalAlpha=.6; g.fill(); g.globalAlpha=1; }
  }
  // decorations back-to-front
  for (let s=0;s<CH*2-1;s++) for (let lx=0;lx<CH;lx++){ const ly=s-lx; if (ly<0||ly>=CH) continue;
    const x=x0+lx,y=y0+ly,i=y*W+x;
    if (road[i]){ const L=lamps.find(l=>l.x===x&&l.y===y); if (L) drawLamp(g,L); continue; }
    if (deco[i] && !nearB[i]) drawDeco(g,deco[i],x,y);
  }
}
function drawRoadTile(g,x,y,i){
  const n=y>0&&road[i-W], s=y<H-1&&road[i+W], w=x>0&&road[i-1], e=x<W-1&&road[i+1];
  poly(g,tileDiamond(x,y),"#c3c1c0");
  const k=.2, side="#e9e3d6";
  if (!n) poly(g,[P(x,y),P(x+1,y),P(x+1,y+k),P(x,y+k)],side);
  if (!s) poly(g,[P(x,y+1-k),P(x+1,y+1-k),P(x+1,y+1),P(x,y+1)],side);
  if (!w) poly(g,[P(x,y),P(x+k,y),P(x+k,y+1),P(x,y+1)],side);
  if (!e) poly(g,[P(x+1-k,y),P(x+1,y),P(x+1,y+1),P(x+1-k,y+1)],side);
  g.strokeStyle="#ffffff"; g.lineWidth=1.3;
  if ((w||e)&&!(n||s)&&x%2===0){ const a=P(x+.2,y+.5),b=P(x+.8,y+.5); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
  if ((n||s)&&!(w||e)&&y%2===0){ const a=P(x+.5,y+.2),b=P(x+.5,y+.8); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
  if ((n||s)&&(w||e)){ g.strokeStyle="rgba(255,255,255,.75)"; g.lineWidth=1; for (let q=.25;q<.8;q+=.18){ const a=P(x+q,y+.15),b=P(x+q,y+.3); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); } }
}
function lampPos(L){ const o=[[.5,.08],[.5,.92],[.08,.5],[.92,.5]][L.edge]; return [L.x+o[0], L.y+o[1]]; }
function drawLamp(g,L){ const [tx,ty]=lampPos(L), b=P(tx,ty); g.fillStyle="#5a524c"; g.fillRect(b[0]-.8,b[1]-18,1.6,18); g.fillStyle="#6b625b"; g.fillRect(b[0]-3,b[1]-19,6,2.2); g.fillStyle="#fff1c9"; g.fillRect(b[0]-2,b[1]-17,4,1.2); }
function drawDeco(g,d,x,y){
  const h=hash2(x,y,31), c=P(x+.3+h*.4, y+.3+((h*97)%1)*.4), X=c[0], Y=c[1];
  if (d===1||d===6){ // round tree
    g.fillStyle="rgba(60,70,40,.18)"; g.beginPath(); g.ellipse(X+3,Y+1,6,2.6,0,0,7); g.fill();
    g.fillStyle="#6b5544"; g.fillRect(X-.8,Y-7,1.6,7);
    const col = d===6 ? "#7aa05a" : (h<.15 ? "#c98a4a" : "#3f5a3c");
    g.fillStyle=col; g.beginPath(); g.arc(X,Y-11,5.5,0,7); g.fill();
    g.fillStyle="rgba(255,255,255,.12)"; g.beginPath(); g.arc(X-1.8,Y-12.8,2.4,0,7); g.fill();
  } else if (d===5){ // conifer
    g.fillStyle="rgba(60,70,40,.18)"; g.beginPath(); g.ellipse(X+3,Y+1,5,2.2,0,0,7); g.fill();
    g.fillStyle="#2f4b3a"; g.beginPath(); g.moveTo(X,Y-20); g.lineTo(X+5,Y-6); g.lineTo(X-5,Y-6); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(X,Y-14); g.lineTo(X+6,Y-1); g.lineTo(X-6,Y-1); g.closePath(); g.fill();
    g.fillStyle="#3c5e48"; g.beginPath(); g.moveTo(X,Y-20); g.lineTo(X+5,Y-6); g.lineTo(X,Y-6); g.closePath(); g.fill();
  } else if (d===2){ g.fillStyle="#a9a196"; g.beginPath(); g.ellipse(X,Y-1.5,5,3,0,0,7); g.fill(); g.fillStyle="#c4bcb0"; g.beginPath(); g.ellipse(X-1,Y-2.6,3,1.6,0,0,7); g.fill(); }
  else if (d===3){ g.fillStyle="#6c9a5c"; g.fillRect(X-1.5,Y-13,3,13); g.fillRect(X-5,Y-9,2.4,5); g.fillRect(X-5,Y-5.5,4,2); g.fillRect(X+2.6,Y-11,2.4,5); g.fillRect(X+1,Y-7,4,2); }
  else if (d===4){ g.fillStyle="#8a9a5c"; g.beginPath(); g.arc(X-1.5,Y-2.5,3,0,7); g.arc(X+2,Y-2,2.5,0,7); g.fill(); }
}
/* zoomed-out overview, drawn once per change */
const OV=8; // overview scale divisor
const overview=document.createElement("canvas"); overview.width=2*W*T/OV; overview.height=W*T/OV;
let overviewDirty=true;
function drawOverview(){
  const g=overview.getContext("2d"); g.clearRect(0,0,overview.width,overview.height);
  const ox=W*T/OV;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const i=y*W+x;
    g.fillStyle = water[i] ? (biome[i]===2?"#9fd3cf":"#a8c6df") : road[i] ? "#b5b2b0" : (deco[i]===1||deco[i]===5) ? "#6f8f64" : groundColor(i);
    g.fillRect(ox+(x-y)*T/OV-2, (x+y)*T/2/OV, 4, 2.2); }
  for (const b of S.buildings){ const t=TYPES[b.type]; g.fillStyle=t.roof||"#8fbf78";
    for (let y=b.y;y<b.y+t.size[1];y++) for (let x=b.x;x<b.x+t.size[0];x++) g.fillRect(ox+(x-y)*T/OV-2,(x+y)*T/2/OV,4,2.2); }
  overviewDirty=false;
}
/* top-down map for the Map sheet */
const mapCanvas=document.createElement("canvas"); mapCanvas.width=mapCanvas.height=W*2;
function drawMap(){
  const g=mapCanvas.getContext("2d");
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const i=y*W+x; g.fillStyle = water[i]?"#a8c6df":road[i]?"#9d9a98":(deco[i]===1||deco[i]===5)?"#7f9f72":groundColor(i); g.fillRect(x*2,y*2,2,2); }
  for (const b of S.buildings){ const t=TYPES[b.type]; g.fillStyle=t.roof||"#7fb06a"; g.fillRect(b.x*2,b.y*2,t.size[0]*2,t.size[1]*2); }

   BUILDINGS (iso boxes)
   ============================================================ */
function box(g,x,y,w,h,H,wall,top,opt){
  opt=opt||{};
  const L=[P(x,y+h),P(x+w,y+h),P(x+w,y+h,H),P(x,y+h,H)], R=[P(x+w,y),P(x+w,y+h),P(x+w,y+h,H),P(x+w,y,H)];
  poly(g,L,shadeHex(wall,.97)); poly(g,R,shadeHex(wall,.8));
  if (top) poly(g,[P(x,y,H),P(x+w,y,H),P(x+w,y+h,H),P(x,y+h,H)],top);
  if (opt.windows){
    const night=opt.night, rows=Math.max(1,Math.floor((H-6)/12));
    const lit=(a,b)=> night && hash2(a,b,opt.seed||1)>.45;
    for (let r=0;r<rows;r++){ const z0=6+r*((H-6)/rows), z1=z0+Math.min(6,(H-6)/rows-3);
      const nL=Math.max(1,Math.floor(w*2)), nR=Math.max(1,Math.floor(h*2));
      for (let c=0;c<nL;c++){ const u0=x+(c+.3)/nL*w, u1=x+(c+.65)/nL*w; poly(g,[P(u0,y+h,z0),P(u1,y+h,z0),P(u1,y+h,z1),P(u0,y+h,z1)], lit(r,c)?"#ffd98a":"#5d6b78"); }
      for (let c=0;c<nR;c++){ const v0=y+(c+.3)/nR*h, v1=y+(c+.65)/nR*h; poly(g,[P(x+w,v0,z0),P(x+w,v1,z0),P(x+w,v1,z1),P(x+w,v0,z1)], lit(r,c+20)?"#f2c879":"#4d5a66"); }
    }
  }
  if (opt.door){ const u=x+w/2; poly(g,[P(u-.18,y+h,0),P(u+.18,y+h,0),P(u+.18,y+h,Math.min(9,H*.7)),P(u-.18,y+h,Math.min(9,H*.7))], opt.night?"#ffcf7a":"#4a3b33"); }
}
function gableRoof(g,x,y,w,h,H,RH,roof,wall){
  if (w>=h){ const r0=P(x,y+h/2,H+RH), r1=P(x+w,y+h/2,H+RH);
    poly(g,[P(x,y,H),P(x+w,y,H),r1,r0],shadeHex(roof,.75));
    poly(g,[P(x+w,y,H),P(x+w,y+h,H),r1],shadeHex(wall,.8));
    poly(g,[r0,r1,P(x+w,y+h,H),P(x,y+h,H)],roof);
  } else { const r0=P(x+w/2,y,H+RH), r1=P(x+w/2,y+h,H+RH);
    poly(g,[P(x,y,H),P(x,y+h,H),r1,r0],shadeHex(roof,.75));
    poly(g,[r0,r1,P(x+w,y+h,H),P(x+w,y,H)],shadeHex(roof,.88));
    poly(g,[P(x,y+h,H),P(x+w,y+h,H),r1],shadeHex(wall,.97));
  }
}
function drawBuilding(g,type,bx,by,night,seed){
  const t=TYPES[type], [w,h]=t.size, x=bx+.12, y=by+.12, ww=w-.24, hh=h-.24;
  // soft shadow
  poly(g,[P(bx+.1,by+.1),P(bx+w+.35,by+.1),P(bx+w+.35,by+h+.2),P(bx+.1,by+h+.2)],"rgba(70,60,40,.14)");
  const opt={night, seed:seed||1, windows:true, door:true};
  switch (t.style){
    case "gable":{
      box(g,x,y,ww,hh,t.H,t.wall,null,opt);
      if (t.chimney){ const c=[x+ww*.7,y+hh*.25]; gableRoof(g,x,y,ww,hh,t.H,t.RH,t.roof,t.wall); box(g,c[0],c[1],.28,.28,t.H+t.RH+6,"#7a4a3a","#5a3a30",{}); }
      else gableRoof(g,x,y,ww,hh,t.H,t.RH,t.roof,t.wall);
      break; }
    case "civic":{
      box(g,x,y,ww,hh,t.H,t.wall,null,opt); gableRoof(g,x,y,ww,hh,t.H,t.RH,t.roof,t.wall);
      for (let k=0;k<5;k++){ const u=x+.3+k*(ww-.6)/4; poly(g,[P(u-.05,y+hh+.15,0),P(u+.05,y+hh+.15,0),P(u+.05,y+hh+.15,t.H-3),P(u-.05,y+hh+.15,t.H-3)],"#fbf8f1"); }
      if (type==="townhall"){ const c=[x+ww/2-.4,y+hh/2-.4]; box(g,c[0],c[1],.8,.8,t.H+t.RH+10,"#efe9dc",null,{}); const tp=P(c[0]+.4,c[1]+.4,t.H+t.RH+22); poly(g,[P(c[0],c[1]+.8,t.H+t.RH+10),P(c[0]+.8,c[1]+.8,t.H+t.RH+10),tp],"#5f6f88"); poly(g,[P(c[0]+.8,c[1],t.H+t.RH+10),P(c[0]+.8,c[1]+.8,t.H+t.RH+10),tp],"#4f5d73"); }
      break; }
    case "shop":{
      box(g,x,y,ww,hh,t.H,t.wall,t.roof,opt);
      poly(g,[P(x,y,t.H),P(x+ww,y,t.H),P(x+ww,y+hh,t.H),P(x,y+hh,t.H)],shadeHex(t.roof,1));
      const z1=t.H*.62,z2=t.H*.42, n=Math.max(6,Math.round(ww*4));
      for (let k=0;k<n;k++){ const u0=x+k/n*ww,u1=x+(k+1)/n*ww; poly(g,[P(u0,y+hh,z1),P(u1,y+hh,z1),P(u1,y+hh+.32,z2),P(u0,y+hh+.32,z2)], k%2?"#fbf6ec":t.awning); }
      const m=Math.max(4,Math.round(hh*4));
      for (let k=0;k<m;k++){ const v0=y+k/m*hh,v1=y+(k+1)/m*hh; poly(g,[P(x+ww,v0,z1),P(x+ww,v1,z1),P(x+ww+.32,v1,z2),P(x+ww+.32,v0,z2)], k%2?"#efe6d6":shadeHex(t.awning,.85)); }
      break; }
    case "flat": case "factory":{
      box(g,x,y,ww,hh,t.H,t.wall,t.roof,opt);
      poly(g,[P(x+.15,y+.15,t.H),P(x+ww-.15,y+.15,t.H),P(x+ww-.15,y+hh-.15,t.H),P(x+.15,y+hh-.15,t.H)],shadeHex(t.roof,1.12));
      box(g,x+ww*.55,y+hh*.3,.5,.4,t.H+5,"#9a9a9a","#b8b8b8",{});
      if (t.style==="factory"){ box(g,x+.3,y+.3,.45,.45,t.H+26,"#8a6b55","#5a463a",{}); const top=P(x+.52,y+.52,t.H+30); g.fillStyle="rgba(235,235,235,.6)"; const k=(performance.now()/600)%1; g.beginPath(); g.arc(top[0]+k*6,top[1]-k*14,4+k*4,0,7); g.fill(); }
      if (t.cross){ const c=P(x+ww/2,y+hh/2,t.H); g.fillStyle="#d4574a"; g.fillRect(c[0]-2.5,c[1]-6,5,12); g.fillRect(c[0]-8,c[1]-1.5,16,3); }
      break; }
    case "dome":{

      const c=P(x+ww/2,y+hh/2,t.H); g.fillStyle=t.roof; g.beginPath(); g.ellipse(c[0],c[1],ww*T*.6,ww*T*.3,0,Math.PI,0); g.ellipse(c[0],c[1],ww*T*.6,ww*T*.3,0,0,Math.PI); g.fill();
      g.beginPath(); g.ellipse(c[0],c[1],ww*T*.6,ww*T*.62,0,Math.PI,0); g.fill();
      g.fillStyle="rgba(255,255,255,.25)"; g.beginPath(); g.ellipse(c[0]-ww*T*.22,c[1]-ww*T*.35,ww*T*.12,ww*T*.08,-.5,0,7); g.fill();

      for (const [a,b] of [[.2,.2],[.8,.25],[.2,.8],[.8,.8]]) drawDeco(g,1,Math.floor(x+ww*a),Math.floor(y+hh*b));

      box(g,x+.3,y+.3,.5,.5,14,"#d4685a","#e8b44a",{});

      for (let r=0;r<7;r++){ const v=y+.2+r*(hh*.62/7); poly(g,[P(x+.2,v),P(x+ww*.95,v),P(x+ww*.95,v+.22),P(x+.2,v+.22)], r%2?t.wall:t.roof); }

      box(g,x+ww-.9,y+hh-1.1,.5,.5,26,"#d8d2c4","#b8b2a4",{});
      break; }
    case "solar":{
      poly(g,[P(x,y),P(x+ww,y),P(x+ww,y+hh),P(x,y+hh)],"#e1cfa2");
      for (let r=0;r<4;r++) for (let c=0;c<3;c++){ const a=x+.25+c*(ww-.4)/3, b=y+.25+r*(hh-.4)/4, cw=(ww-.4)/3-.25, chh=(hh-.4)/4-.35;
        poly(g,[P(a,b,6),P(a+cw,b,6),P(a+cw,b+chh,2),P(a,b+chh,2)],"#3d5a86"); poly(g,[P(a,b,6),P(a+cw,b,6),P(a+cw,b+.06,6),P(a,b+.06,6)],"#9fc0e6"); }

function treeAt(g,X,Y,palm,fruit){

  if (palm){ g.strokeStyle="#8a6a45"; g.lineWidth=1.8; g.beginPath(); g.moveTo(X,Y); g.quadraticCurveTo(X+3,Y-8,X+1,Y-16); g.stroke();
    g.fillStyle="#5f8f4a"; for (let k=0;k<5;k++){ const a=-Math.PI/2+(k-2)*.7; g.beginPath(); g.ellipse(X+1+Math.cos(a)*5,Y-16+Math.sin(a)*3+2,6,1.8,a,0,7); g.fill(); } return; }
  g.fillStyle="#6b5544"; g.fillRect(X-.8,Y-7,1.6,7);

function drawPerson(g,ix,iy,color,opts){
  const bob=opts.walking?Math.abs(Math.sin(performance.now()/110))*1.5:0;
  g.fillStyle="rgba(60,50,40,.22)"; g.beginPath(); g.ellipse(ix,iy,5,2.4,0,0,7); g.fill();
  if (opts.isMe){ g.strokeStyle="#e8b44a"; g.lineWidth=2; g.beginPath(); g.ellipse(ix,iy,9,4.4,0,0,7); g.stroke(); }
  g.fillStyle=color; g.beginPath(); g.roundRect ? g.roundRect(ix-4,iy-12-bob,8,11,4) : g.rect(ix-4,iy-12-bob,8,11); g.fill();
  g.fillStyle="#f0cfae"; g.beginPath(); g.arc(ix,iy-15.5-bob,3.6,0,7); g.fill();
  g.fillStyle=shadeHex(/^#[0-9a-f]{6}$/i.test(color)?color:"#7b6a5a",.5); g.beginPath(); g.arc(ix,iy-16.6-bob,3.7,Math.PI*1.05,Math.PI*1.95); g.fill();

function label(g,ix,iy,text,z,dark,small){

  g.font="800 "+fs+"px Nunito, system-ui, sans-serif"; g.textAlign="center"; g.textBaseline="middle";
  const w=g.measureText(text).width+fs*1.2, h=fs*1.6;

/* ============================================================
   TRAFFIC: cars keep to their lane, queue, give way at junctions,
   and now and then someone doesn't, which causes a crash and a jam
   ============================================================ */
const DX=[1,0,-1,0], DY=[0,1,0,-1];
const isRoad=(x,y)=>inMap(x,y)&&road[y*W+x]===1;
function roadExits(x,y){ const o=[]; for (let d=0;d<4;d++) if (isRoad(x+DX[d],y+DY[d])) o.push(d); return o; }
function pickOut(x,y,din){ const o=roadExits(x,y), back=(din+2)%4, f=o.filter(d=>d!==back); if (!f.length) return o.length?o[0]:back; if (f.includes(din)&&Math.random()<.6) return din; return f[Math.random()*f.length|0]; }
const CAR_COL=["#d4685a","#e8b44a","#6f9fc8","#8f8fa3","#f2efe8","#5d8b57","#9a7cc9","#3f4a5a","#c97a9a"];
let traffic=[], accidents=[], carSeq=1, accSeq=1, lastCrash=-1e9;
const CRASH_GAP=75000;
function spawnCar(){
  for (let tries=0;tries<12;tries++){
    const i=roadList[Math.random()*roadList.length|0]; if (i==null) return;
    const x=i%W, y=(i/W)|0, o=roadExits(x,y); if (!o.length||traffic.some(c=>c.x===x&&c.y===y)) continue;
    const din=o[Math.random()*o.length|0];
    traffic.push({id:carSeq++,x,y,din,dout:pickOut(x,y,din),p:.05,v:0,vmax:1.5+Math.random()*.9,col:CAR_COL[Math.random()*CAR_COL.length|0],bus:Math.random()<.07,state:"drive",wait:0,conf:-1});
    return;
  }
}
function carPos(c){ const d=c.p<.5?c.din:c.dout, t=c.p-.5; return {tx:c.x+.5+DX[d]*t-DY[d]*.22, ty:c.y+.5+DY[d]*t+DX[d]*.22, d}; }
function activeCrashes(){ return accidents.filter(a=>a.state!=="done"); }
function updateTraffic(dt,now){
  const want=Math.min(70,Math.round(roadList.length/6));
  if (traffic.length<want && Math.random()<dt*3) spawnCar();
  const at=new Map(); for (const c of traffic){ const i=c.y*W+c.x; let a=at.get(i); if (!a) at.set(i,a=[]); a.push(c); }
  const live=activeCrashes(), crashTiles=new Set(live.map(a=>a.y*W+a.x));
  for (const c of traffic){
    if (c.state!=="drive") continue;
    if (!isRoad(c.x,c.y)){ c.dead=true; continue; }
    let block=false; const cd=c.p<.5?c.din:c.dout;
    for (const o of at.get(c.y*W+c.x)||[]){ if (o===c) continue;
      if (o.state!=="drive"){ if (o.p>c.p-.05) block=true; continue; }
      const od=o.p<.5?o.din:o.dout; if (od===cd&&o.p>c.p&&o.p-c.p<.42) block=true; }
    const nx=c.x+DX[c.dout], ny=c.y+DY[c.dout], ni=ny*W+nx, room=1-c.p;
    if (!block && c.p>.45){
      if (crashTiles.has(ni)&&room<.4) block=true;
      const there=at.get(ni)||[];
      for (const o of there){ if (o.state!=="drive"){ if (room<.4) block=true; continue; } if (o.din===c.dout&&room+o.p<.45) block=true; }
      if (!block && room<.32 && roadExits(nx,ny).length>=3){
        const cross=there.find(o=>o.state==="drive"&&o.din!==c.dout&&o.din!==(c.dout+2)%4);
        if (cross){
          if (c.conf!==ni){ c.conf=ni;
            if (now-lastCrash>CRASH_GAP && live.length<2 && Math.random()<.12){ crash(c,cross,nx,ny,now); continue; } }
          if (c.wait<5) block=true;
        }
      }
    }
    if (block){ c.v=0; c.wait+=dt; if (c.wait>50&&!live.length) c.dead=true; continue; }
    c.wait=Math.max(0,c.wait-dt); c.v=Math.min(c.vmax,c.v+dt*2.5); c.p+=c.v*dt;
    if (c.p>=1){ c.p-=1; c.x=nx; c.y=ny; c.din=c.dout; if (!isRoad(c.x,c.y)){ c.dead=true; continue; } c.dout=pickOut(c.x,c.y,c.din); c.conf=-1; }
  }
  for (const a of accidents){
    if (a.state==="waiting" && a.unit && now>=a.unit.arrive) a.state="clearing";
    if (a.state!=="done" && now>=a.clearAt){ a.state="done"; for (const c of a.cars) c.dead=true;
      toast(a.unit?"Police cleared the crash near the "+a.near+". Traffic is moving again.":"The crash near the "+a.near+" was towed away."); }
  }
  traffic=traffic.filter(c=>!c.dead);
  accidents=accidents.filter(a=>a.state!=="done"||(a.unit&&now<a.unit.back));

function crash(c,o,x,y,now){
  c.x=x; c.y=y; c.din=c.dout; c.p=.32; c.state=o.state="crashed"; c.v=o.v=0; lastCrash=now;
  const a={id:accSeq++,x,y,cars:[c,o],state:"waiting",t0:now,near:nearestName(x,y)};

  if (path){ a.unit=mkUnit("police",path,now+2500,5,6000); a.clearAt=a.unit.workEnd; toast("Crash near the "+a.near+"! Police are on the way."); }
  else { a.clearAt=now+90000; toast("Crash near the "+a.near+". Build a Police Station to clear crashes faster."); }

}
function nearestOf(type,x,y){ let best=null,bd=1e9; for (const b of S.buildings){ if (b.type!==type) continue; const t=TYPES[b.type], d=Math.hypot(b.x+t.size[0]/2-x,b.y+t.size[1]/2-y); if (d<bd){ bd=d; best=b; } } return best; }
function nearestName(x,y){ let best="road",bd=1e9; for (const b of S.buildings){ const t=TYPES[b.type], d=Math.hypot(b.x+t.size[0]/2-x,b.y+t.size[1]/2-y); if (d<bd){ bd=d; best=t.name; } } return best; }
function roadNear(b){
  const [w,h]=TYPES[b.type].size, dx=b.x+w/2, dy=b.y+h;
  let best=-1, bd=1e9;
  for (let y=b.y-6;y<b.y+h+6;y++) for (let x=b.x-6;x<b.x+w+6;x++){ if (!isRoad(x,y)) continue;
    const ring=Math.max(b.x-x, x-(b.x+w-1), b.y-y, y-(b.y+h-1), 0), d=ring*100+Math.hypot(x+.5-dx,y+.5-dy);
    if (d<bd){ bd=d; best=y*W+x; } }

function bfs(a,z){
  if (a===z) return [a];
  const prev=new Int32Array(W*H).fill(-1), q=new Int32Array(W*H); let h=0,t=0; prev[a]=a; q[t++]=a;
  while (h<t){ const i=q[h++]; if (i===z) break; const x=i%W, y=(i/W)|0;
    for (let d=0;d<4;d++){ const nx=x+DX[d], ny=y+DY[d]; if (!isRoad(nx,ny)) continue; const j=ny*W+nx; if (prev[j]!==-1) continue; prev[j]=i; q[t++]=j; } }
  if (prev[z]===-1) return null;
  const path=[]; for (let i=z;i!==a;i=prev[i]) path.push(i); path.push(a); return path.reverse();
}
/* an emergency vehicle: drives out along a road path, works on site, drives back */
function mkUnit(kind,path,t0,speed,work){ const travel=Math.max(0,path.length-1)/speed*1000; return {kind,path,t0,speed,arrive:t0+travel,workEnd:t0+travel+work,back:t0+2*travel+work}; }
function unitPos(u,now){
  if (now<u.t0||now>=u.back) return null;
  const L=u.path.length-1;
  if (L<=0){ const p=u.path[0]; return {tx:p%W+.5,ty:((p/W)|0)+.5,d:0}; }
  let s = now<u.arrive ? (now-u.t0)/1000*u.speed : now<u.workEnd ? L : L-(now-u.workEnd)/1000*u.speed;
  s=Math.max(0,Math.min(L,s)); const i=Math.min(L-1,Math.floor(s)), f=s-i;

  return {tx:ax+.5+(bx-ax)*f, ty:ay+.5+(by-ay)*f, d};

/* ============================================================
   FIRES: decided by the clock, so every screen sees the same fire
   ============================================================ */
const FIRE_SLOT=150000, NOBURN=new Set(["park","playground","farm","solar","mine","pool","plaza","stadium","orchard","wind","fair"]);
let fireCache=new Map(); const shownToasts=new Set();
function fireEvent(k){
  if (fireCache.has(k)) return fireCache.get(k);
  let ev=null;
  if (hash2(k,1,SEED+77)<.6){
    const cand=S.buildings.filter(b=>!NOBURN.has(TYPES[b.type].style)&&b.type!=="fire");
    if (cand.length){
      const b=cand[Math.floor(hash2(k,3,SEED+77)*cand.length)], t0=k*FIRE_SLOT+Math.floor(hash2(k,2,SEED+77)*60000);
      ev={k,b,t0,near:TYPES[b.type].name};
      const st=nearestOf("fire",b.x,b.y); let path=null;
      if (st){ const s=roadNear(st), z=roadNear(b); if (s>=0&&z>=0) path=bfs(s,z); }
      if (path){ ev.unit=mkUnit("fire",path,t0+4000,4.5,9000); ev.tOut=ev.unit.workEnd; } else ev.tOut=t0+60000;
    }
  }
  fireCache.set(k,ev); return ev;
}
function fireEvents(now){ const k=Math.floor(now/FIRE_SLOT), out=[]; for (const kk of [k-1,k]){ const e=fireEvent(kk); if (e&&now>=e.t0&&now<Math.max(e.tOut,e.unit?e.unit.back:0)) out.push(e); } return out; }
function burningMap(now){ const m=new Map(); for (const e of fireEvents(now)) if (now<e.tOut) m.set(e.b.id,e); return m; }
function incidentToasts(now){
  for (const e of fireEvents(now)){
    const k1="f"+e.k, k2="o"+e.k;
    if (now<e.tOut && !shownToasts.has(k1)){ shownToasts.add(k1); toast("Fire at the "+e.near+"! "+(e.unit?"The fire brigade is on the way.":"There's no fire station to send help.")); }
    if (now>=e.tOut && shownToasts.has(k1) && !shownToasts.has(k2)){ shownToasts.add(k2); toast("The fire at the "+e.near+" is out."); }
  }
}

/* vehicles */
function drawVehicle(g,tx,ty,d,kind,col){
  const along=d%2===0, big=kind==="fire"||kind==="bus";
  const len=kind==="bus"?1.1:kind==="fire"?1.05:kind==="police"?.6:.55, wid=big?.36:.3, hh=big?8:5;
  const bw=along?len:wid, bh=along?wid:len, x=tx-bw/2, y=ty-bh/2;
  const c=kind==="police"?"#f2f2f2":kind==="fire"?"#d23b2f":kind==="bus"?"#e8b44a":col;
  box(g,x,y,bw,bh,hh,c,shadeHex(c,1.06),{});
  const flash=(performance.now()/160|0)%2;
  if (kind==="car"||kind==="police"){ const k=.22;
    poly(g,[P(x+bw*k,y+bh*k,hh+3),P(x+bw*(1-k),y+bh*k,hh+3),P(x+bw*(1-k),y+bh*(1-k),hh+3),P(x+bw*k,y+bh*(1-k),hh+3)],kind==="police"?"#2f4f8a":shadeHex(c,.85));
    poly(g,[P(x+bw*k,y+bh*(1-k),hh),P(x+bw*(1-k),y+bh*(1-k),hh),P(x+bw*(1-k),y+bh*(1-k),hh+3),P(x+bw*k,y+bh*(1-k),hh+3)],"#9db4c8"); }
  if (kind==="police"){ const c0=P(tx,ty,hh+4.5); g.fillStyle=flash?"#ff4d4d":"#4d7dff"; g.fillRect(c0[0]-3.5,c0[1]-2,3.5,2.2); g.fillStyle=flash?"#4d7dff":"#ff4d4d"; g.fillRect(c0[0],c0[1]-2,3.5,2.2); }
  if (kind==="fire"){
    const p0=P(along?x+.12:tx, along?ty:y+.12, hh+1.6), p1=P(along?x+bw-.12:tx, along?ty:y+bh-.12, hh+1.6);
    g.strokeStyle="#e4e4e4"; g.lineWidth=2.6; g.beginPath(); g.moveTo(p0[0],p0[1]); g.lineTo(p1[0],p1[1]); g.stroke();
    g.strokeStyle="#9a9a9a"; g.lineWidth=.7; g.stroke();
    const c0=P(tx,ty,hh+1); g.fillStyle=flash?"#ff5a3a":"#ffffff"; g.fillRect(c0[0]-2,c0[1]-3,4,2);
  }
  if (kind==="bus"&&along) for (let k=0;k<4;k++){ const u=x+.1+k*(bw-.2)/4; poly(g,[P(u,y+bh,3),P(u+.16,y+bh,3),P(u+.16,y+bh,5.5),P(u,y+bh,5.5)],"#5d6b78"); }
}
function drawFire(g,b,spraying){
  const t=TYPES[b.type],[w,h]=t.size, top=(t.H||10)+(t.RH||0)*.5, c=P(b.x+w/2,b.y+h/2,top), tt=performance.now()/1000;
  for (let k=0;k<7;k++){ const ph=(tt*.45+k/7)%1; g.fillStyle="rgba(80,74,74,"+(.5*(1-ph)).toFixed(3)+")"; g.beginPath(); g.arc(c[0]+Math.sin(k*2+tt)*5+ph*16,c[1]-12-ph*70,5+ph*13,0,7); g.fill(); }
  const n=spraying?3:5;
  for (let k=0;k<n;k++){ const ox=(k-(n-1)/2)*w*3.4, fl=(spraying?7:11)+Math.sin(tt*9+k*1.7)*3.5; flame(g,c[0]+ox,c[1]+Math.abs(k-(n-1)/2)*2.5,fl,k%2?"#ffb03b":"#ff6a2b"); }
}
function flame(g,x,y,hgt,col){
  g.fillStyle=col; g.beginPath(); g.moveTo(x-4.5,y); g.quadraticCurveTo(x-4.5,y-hgt*.6,x,y-hgt); g.quadraticCurveTo(x+4.5,y-hgt*.6,x+4.5,y); g.closePath(); g.fill();
  g.fillStyle="#ffe08a"; g.beginPath(); g.moveTo(x-2,y); g.quadraticCurveTo(x-2,y-hgt*.35,x,y-hgt*.55); g.quadraticCurveTo(x+2,y-hgt*.35,x+2,y); g.closePath(); g.fill();
}
function drawCrashMarker(g,a){
  const p=P(a.x+.5,a.y+.5), tt=performance.now()/1000;
  for (let k=0;k<4;k++){ const ph=(tt*.6+k/4)%1; g.fillStyle="rgba(120,115,110,"+(.45*(1-ph)).toFixed(3)+")"; g.beginPath(); g.arc(p[0]+ph*8,p[1]-8-ph*30,3+ph*7,0,7); g.fill(); }
  const y=p[1]-30-Math.abs(Math.sin(tt*3))*2;
  g.fillStyle="#e8a33a"; g.beginPath(); g.moveTo(p[0],y-9); g.lineTo(p[0]+8,y+5); g.lineTo(p[0]-8,y+5); g.closePath(); g.fill();
  g.fillStyle="#3b322c"; g.fillRect(p[0]-.9,y-4,1.8,5); g.fillRect(p[0]-.9,y+2,1.8,1.6);
  if (a.state==="clearing") for (const [ox,oy] of [[-.35,-.35],[.35,-.35],[-.35,.35],[.35,.35]]){ const q=P(a.x+.5+ox,a.y+.5+oy); g.fillStyle="#f08a3a"; g.beginPath(); g.moveTo(q[0],q[1]-6); g.lineTo(q[0]+2.4,q[1]); g.lineTo(q[0]-2.4,q[1]); g.closePath(); g.fill(); g.fillStyle="#fff"; g.fillRect(q[0]-1.4,q[1]-3.4,2.8,1); }
}

function nightAmount(frac){ const h=frac*24; if (h>=7&&h<=18) return 0; if (h>18&&h<20.5) return (h-18)/2.5; if (h<5||h>=20.5) return 1; return (7-h)/2; }

function draw(now){

    const c0x=Math.max(0,Math.floor(minx/CH)), c1x=Math.min(W/CH-1,Math.floor(maxx/CH)), c0y=Math.max(0,Math.floor(miny/CH)), c1y=Math.min(H/CH-1,Math.floor(maxy/CH));
    const list=[]; for (let cy=c0y;cy<=c1y;cy++) for (let cx=c0x;cx<=c1x;cx++){ const [ox,oy]=P(cx*CH,cy*CH); const L=ox-CH*T, Tp=oy-PAD; if (L>br.x||L+2*CH*T<tl.x||Tp>br.y||Tp+CH*T+PAD<tl.y) continue; list.push([cx,cy,L,Tp]); }

  const ppl=everyone(now);
  for (const p of ppl) items.push({d:(p.x+p.y)/T+.2, p});
  if (z>.5){
    for (const n of npcs){ const st=autoState(n.id,{x:n.home.x+1,y:n.home.y+1},now); if (!vis(isoX(st.x,st.y),isoY(st.x,st.y),40)) continue; if (st.act&&st.act.startsWith("Asleep")) continue; items.push({d:(st.x+st.y)/T+.2,n,st}); }

    else if (it.veh) drawVehicle(ctx,it.veh.tx,it.veh.ty,it.veh.d,it.veh.kind,it.veh.col);
    else if (it.n){ drawPerson(ctx,isoX(it.st.x,it.st.y),isoY(it.st.x,it.st.y),it.n.color,{walking:it.st.walking}); }
    else { const p=it.p, ix=isoX(p.x,p.y), iy=isoY(p.x,p.y); drawPerson(ctx,ix,iy,p.rec.color||"#7b6a5a",{isMe:p.me,walking:p.walking}); hitPeople.push({id:p.id,ix,iy}); }
  }

  for (const e of fires){ if (!e.unit||now<e.unit.arrive||now>=e.unit.workEnd) continue; const st=unitPos(e.unit,now); if (!st) continue;
    const t=TYPES[e.b.type], a=P(st.tx,st.ty,10), b=P(e.b.x+t.size[0]/2,e.b.y+t.size[1]/2,(t.H||10)+(t.RH||0)*.5);
    ctx.save(); ctx.strokeStyle="rgba(150,205,255,.95)"; ctx.lineWidth=2.2; ctx.setLineDash([4,3]); ctx.lineDashOffset=-performance.now()/25;
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo((a[0]+b[0])/2,Math.min(a[1],b[1])-34,b[0],b[1]); ctx.stroke(); ctx.restore(); }
  for (const a of accidents) if (a.state!=="done") drawCrashMarker(ctx,a);
  // placement ghost
  if (S.place && S.ghost){
    const t=TYPES[S.place], ok=canPlace(S.place,S.ghost.x,S.ghost.y).ok;
    poly(ctx,[P(S.ghost.x,S.ghost.y),P(S.ghost.x+t.size[0],S.ghost.y),P(S.ghost.x+t.size[0],S.ghost.y+t.size[1]),P(S.ghost.x,S.ghost.y+t.size[1])], ok?"rgba(93,139,87,.45)":"rgba(212,104,90,.5)");
    ctx.globalAlpha=.8; drawBuilding(ctx,S.place,S.ghost.x,S.ghost.y,false,1); ctx.globalAlpha=1;
  }
  // night: purple wash, then warm and coloured glows
  if (night>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.fillStyle="rgba(46,30,96,"+(night*.6).toFixed(3)+")"; ctx.fillRect(0,0,innerWidth,innerHeight);
    ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(innerWidth/2-c.x*z),DPR*(innerHeight/2-c.y*z));

    let n=0;

      for (const it of items){ if (!it.veh) continue; const p=P(it.veh.tx,it.veh.ty); if (it.veh.kind==="police"||it.veh.kind==="fire"){ const f=(performance.now()/160|0)%2; glow(p[0],p[1]-8,26,f?"rgb(255,80,80)":"rgb(80,120,255)",.7*night); } else glow(p[0],p[1]-2,14,"rgb(255,230,180)",.5*night); }

    }

  }

  if (z>1.05){ for (const bi of hitBuildings){ const b=S.buildings[bi], t=TYPES[b.type]; const p=P(b.x+t.size[0],b.y+t.size[1]); label(ctx,p[0]-t.size[0]*T*.5,p[1]-T*.2,t.name,z,false,true); } }
  for (const hp of hitPeople){ const rec=S.players[hp.id]; const p=ppl.find(q=>q.id===hp.id); let y=hp.iy-28;
    const hh=label(ctx,hp.ix,y,rec.name+(p&&p.away?" · away":""),z,false,false);
    if (p&&p.act&&(p.me||z>1.4)) label(ctx,hp.ix,y-hh-2,p.act,z,true,true); }
  // drizzle
  if (weatherFor(gt.day)==="Drizzle"){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.strokeStyle="rgba(120,140,170,.35)"; ctx.lineWidth=1; ctx.beginPath(); const tt=performance.now()/7; for (let k=0;k<90;k++){ const x=(hash2(k,1,5)*innerWidth+tt*.3)%innerWidth, y=(hash2(k,2,5)*innerHeight+tt*2.2)%innerHeight; ctx.moveTo(x,y); ctx.lineTo(x-3,y+9); } ctx.stroke(); }
}

/* ============================================================
   PLACEMENT + SAVING
   ============================================================ */
function canPlace(type,x,y){
  const t=TYPES[type],[w,h]=t.size;
  if (x<1||y<1||x+w>W-1||y+h>H-1) return {ok:false,why:"Too close to the edge of the map"};
  for (let yy=y;yy<y+h;yy++) for (let xx=x;xx<x+w;xx++){ const i=yy*W+xx; if (water[i]) return {ok:false,why:"Can't build on water"}; if (occ[i]>=0) return {ok:false,why:"Something is already built here"}; if (road[i]) return {ok:false,why:"A road runs through here"}; }
  if (t.biome){ const bi=biome[(y+(h>>1))*W+x+(w>>1)]; if (!t.biome.includes(bi)) return {ok:false,why:"Only on "+t.biome.map(b=>BIOMES[b].toLowerCase()).join(" or ")}; }
  if ((S.me?.credits||0)<t.price) return {ok:false,why:"You need "+fmt(t.price-(S.me?.credits||0))+" more coins"};
  return {ok:true};
}
async function placeBuilding(type,x,y){
  const chk=canPlace(type,x,y); if (!chk.ok){ toast(chk.why); return; }
  const t=TYPES[type], rec={type,x,y,by:S.uid||"solo",at:Date.now()};
  S.me.credits-=t.price; markDirty(true);
  if (S.db){ try { await S.db.collection("buildings").add(rec); } catch(e){ S.me.credits+=t.price; markDirty(true); toast(e&&e.code==="quota_exceeded"?"The town is full: no room left for more buildings.":"Couldn't save that building. Try again."); return; } }
  else { soloState.buildings.push(Object.assign({id:"l"+Date.now()},rec)); saveSolo(); setBuildings(soloState.buildings); }
  toast("Built a "+t.name,"−"+fmt(t.price));
  if (!S.me.home){ S.me.home={x:x+1,y:y+1}; markDirty(true); }
  S.ghost=null; renderDrawer();
}
async function commitRoads(){
  const tiles=[...S.roadTiles], cost=tiles.length*ROAD_PRICE; if (!tiles.length) return;
  if (S.me.credits<cost){ toast("Not enough coins for "+tiles.length+" road tiles"); return; }
  const by={}; for (const i of tiles){ const x=i%W,y=Math.floor(i/W),k="r_"+Math.floor(x/CH)+"_"+Math.floor(y/CH); (by[k]||=[]).push((y%CH)*CH+(x%CH)); }
  S.me.credits-=cost; markDirty(true);
  for (const k in by){ const merged=Array.from(new Set([...(S.dbRoads[k]||[]),...by[k]])).sort((a,b)=>a-b); S.dbRoads[k]=merged;
    if (S.db){ try { await S.db.doc("roads/"+k).set({t:merged}); } catch(e){ toast("Some roads didn't save. Try again."); } } }
  if (!S.db){ soloState.roads=S.dbRoads; saveSolo(); }
  S.roadTiles=new Set(); rebuildRoads(); toast("Paved "+tiles.length+" tiles","−"+fmt(cost)); renderDrawer();
}
let dirty=false;
function markDirty(now){ dirty=true; if (now) flush(); }
function flush(){
  if (!dirty||!S.me) return; dirty=false;
  const snap={name:S.me.name,color:S.me.color,credits:Math.floor(S.me.credits),earned:Math.floor(S.me.earned||0),tasks:S.me.tasks||0,home:S.me.home||null,created:S.me.created||Date.now(),lastSeen:Date.now()};
  if (S.db&&S.uid&&S.uid!=="solo") S.saveChain=S.saveChain.then(()=>S.db.doc("players/"+S.uid).set(snap)).catch(()=>{ dirty=true; });
  else { soloState.me=snap; saveSolo(); }
}

function buildingNear(wx,wy){
  const tx=wx/T, ty=wy/T; let best=null, bd=1e9;
  for (const b of S.buildings){ const [w,h]=TYPES[b.type].size;
    if (tx>=b.x-1&&tx<=b.x+w+1&&ty>=b.y-1&&ty<=b.y+h+1){ const d=Math.hypot(tx-(b.x+w/2),ty-(b.y+h/2)); if (d<bd){ bd=d; best=b; } } }
  return best;
}

const pointers=new Map(); let drag=null, pinch=null;
function anyKey(){ const k=S.keys; return k.w||k.a||k.s||k.d||k.arrowup||k.arrowdown||k.arrowleft||k.arrowright; }

addEventListener("keyup",e=>{ S.keys[e.key.toLowerCase()]=false; });

  if (pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; drag=null; return; }
  drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,painting:S.build&&S.mode==="pave"};
  if (drag.painting) paintAt(e.clientX,e.clientY);

function endPointer(e){ pointers.delete(e.pointerId); if (pointers.size<2) pinch=null; if (drag&&!drag.moved&&!drag.painting&&e.type==="pointerup") clickAt(e.clientX,e.clientY,e.pointerType); if (!pointers.size){ if (drag&&drag.painting) renderDrawer(); drag=null; } }

function paintAt(sx,sy){ const w=screenToWorld(sx,sy), x=Math.floor(w.x/T), y=Math.floor(w.y/T); if (!inMap(x,y)) return; const i=y*W+x; if (water[i]||occ[i]>=0||road[i]||S.roadTiles.has(i)) return; if ((S.roadTiles.size+1)*ROAD_PRICE>S.me.credits) return; S.roadTiles.add(i); }

let last=performance.now(), creditAcc=0, presAcc=0, uiAcc=0, lastPres="", lastNear=null;
function tick(nowP){
  const dt=Math.min(.1,(nowP-last)/1000); last=nowP; const now=Date.now();
  if (S.playing){
    let vx=0,vy=0; const k=S.keys;
    // screen directions in world space: up = (-1,-1), right = (+1,-1)
    if (k.w||k.arrowup){ vx-=1; vy-=1; } if (k.s||k.arrowdown){ vx+=1; vy+=1; } if (k.a||k.arrowleft){ vx-=1; vy+=1; } if (k.d||k.arrowright){ vx+=1; vy-=1; }
    const speed=k.shift?170:95;
    if ((vx||vy)&&S.task){ S.task=null; }
    if (!vx&&!vy&&S.target){ const dx=S.target.x-S.pos.x, dy=S.target.y-S.pos.y, d=Math.hypot(dx,dy); if (d<2) S.target=null; else { vx=dx/d; vy=dy/d; } }
    else if (vx||vy){ const m=Math.hypot(vx,vy); vx/=m; vy/=m; }
    if (vx||vy){ const nx=S.pos.x+vx*speed*dt, ny=S.pos.y+vy*speed*dt, okX=!blocked(nx,S.pos.y), okY=!blocked(S.pos.x,ny); if (okX) S.pos.x=nx; if (okY) S.pos.y=ny; if (!okX&&!okY) S.target=null; }
    if (S.follow&&!followId){ const tx=isoX(S.pos.x,S.pos.y), ty=isoY(S.pos.x,S.pos.y); S.cam.x+=(tx-S.cam.x)*Math.min(1,dt*6); S.cam.y+=(ty-S.cam.y)*Math.min(1,dt*6); }
    if (S.task&&performance.now()-S.task.start>=S.task.secs*1000) finishTask();
    if (document.visibilityState==="visible"){ creditAcc+=dt; if (creditAcc>=1){ const n=Math.floor(creditAcc); creditAcc-=n; S.me.credits+=n; S.me.earned=(S.me.earned||0)+n; dirty=true; } }
    $("credits").textContent=fmt(S.me.credits);
    presAcc+=dt;
    if (S.room&&presAcc>.1){ presAcc=0; const act=S.task?TYPES[S.task.b.type].verb+" at "+TYPES[S.task.b.type].name:null, walking=!!(S.target||anyKey()); const sig=Math.round(S.pos.x)+","+Math.round(S.pos.y)+","+act+","+walking; if (sig!==lastPres){ lastPres=sig; S.room.presence({pid:S.uid,x:Math.round(S.pos.x),y:Math.round(S.pos.y),act,walking}).catch(()=>{}); } }
    // walking into a building opens its card
    const nb=S.task?S.task.b:buildingNear(S.pos.x,S.pos.y);
    if (nb!==lastNear){ lastNear=nb; if (nb&&!S.build&&(!S.sheet||S.sheet.kind==="building")) showBuilding(nb.id); else if (!nb&&S.sheet&&S.sheet.kind==="building"&&!S.target) closeSheet(); }
    if (S.task){ const bar=$("taskBar"); if (bar){ const p=Math.min(1,(performance.now()-S.task.start)/(S.task.secs*1000)); bar.style.width=(p*100).toFixed(1)+"%"; const l=$("taskLbl"); if (l) l.textContent=TYPES[S.task.b.type].verb+"… "+Math.ceil(S.task.secs*(1-p))+"s"; } }
  }
  if (followId){ const p=everyone(now).find(q=>q.id===followId); if (p){ S.cam.x+=(isoX(p.x,p.y)-S.cam.x)*Math.min(1,dt*5); S.cam.y+=(isoY(p.x,p.y)-S.cam.y)*Math.min(1,dt*5); } }
  uiAcc+=dt;
  if (uiAcc>.5){ uiAcc=0;
    const gt=gameTime(now), hh=Math.floor(gt.frac*24), mm=Math.floor((gt.frac*24-hh)*6)*10, night=nightAmount(gt.frac)>.5, wth=weatherFor(gt.day);
    $("day").textContent="Day "+gt.day+" · "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
    $("weather").innerHTML=(night?ICON.moon:wth==="Drizzle"?ICON.rain:wth==="Cloudy"?ICON.cloud:ICON.sun)+"<span></span>"; $("weather").lastChild.textContent=wth;
    const c=screenToWorld(innerWidth/2,innerHeight/2); $("coords").textContent="X "+Math.floor(c.x/T-TOWN.x)+" · Y "+Math.floor(c.y/T-TOWN.y);
    const names=Object.keys(S.players).filter(id=>S.players[id]&&(id===S.uid?S.playing:(S.online[id]&&now-S.online[id].seen<15000))).map(id=>S.players[id].name);
    $("liveWho").textContent=(names.length?names.join(" & ")+" in town":"nobody playing right now")+" · "+npcs.length+" townsfolk"+(()=>{ const f=burningMap(now).size, c=activeCrashes().length; return (f?" · "+f+" fire"+(f>1?"s":""):"")+(c?" · "+c+" crash"+(c>1?"es":""):""); })();
  }
  updateTraffic(dt,now); incidentToasts(now);
  draw(now);
  requestAnimationFrame(tick);
}
function blocked(wx,wy){ const x=Math.floor(wx/T), y=Math.floor(wy/T); if (!inMap(x,y)) return true; return water[y*W+x]===1; }

/* ============================================================
   LOGIN + DATA
   ============================================================ */
let pickedColor=COLORS[0];
function renderLogin(state){
  const box=$("loginBody"); box.textContent="";
  if (state==="loading"){ box.append(el("p",null,"Opening the town…")); return; }
  if (state==="readonly"){ box.append(el("p",null,"Your access to this page is view-only, so you can watch the town but can't move in. Ask the owner to share it with you as a Contributor."), el("button",{class:"dark",onclick:()=>{ $("login").hidden=true; }},"Watch the town")); return; }
  if (S.me&&S.me.name){
    const st=autoState(S.uid,homeOf(S.uid,S.me),Date.now());
    box.append(el("p",null,"Welcome back. "+S.me.name+" is "+(st.act?st.act.charAt(0).toLowerCase()+st.act.slice(1):"out for a walk")+" right now."),
      S.solo?el("p",{class:"note"},"Practice mode: the shared town isn't reachable from here, so progress stays in this browser."):null,
      el("button",{class:"dark",style:"width:100%",onclick:enterGame},"Take over from "+S.me.name));
    return;
  }
  const form=el("form",{style:"display:grid;gap:12px"});
  const input=el("input",{type:"text",id:"charName",maxlength:"18",placeholder:"e.g. Nim",autocomplete:"off",required:true});
  const sw=el("div",{class:"swatches",role:"group","aria-label":"Colour"});
  COLORS.forEach(c=>sw.append(el("button",{type:"button",style:"background:"+c,"aria-label":"Colour "+c,"aria-pressed":String(c===pickedColor),onclick:()=>{ pickedColor=c; [...sw.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(COLORS[i]===c))); }})));
  form.append(el("label",{for:"charName"},"Your character's name"),input,el("label",null,"Their colour"),sw,
    el("p",{class:"note"},S.solo?"Practice mode: the shared town isn't reachable from here, so this character lives in this browser only.":"You start with "+START_CREDITS+" coins and earn 1 more for every second you're here."),
    el("button",{class:"dark",type:"submit"},"Move in"));
  form.addEventListener("submit",async e=>{ e.preventDefault(); const name=input.value.trim().replace(/\s+/g," ").slice(0,18); if (!name){ input.focus(); return; }
    S.me={name,color:pickedColor,credits:START_CREDITS,earned:0,tasks:0,home:null,created:Date.now()}; if (S.uid) S.players[S.uid]=S.me; dirty=true; flush(); try { await S.saveChain; } catch(e){} enterGame(); });
  box.append(form); setTimeout(()=>input.focus(),50);
}
function enterGame(){
  $("login").hidden=true; S.playing=true;
  const st=autoState(S.uid||"solo",homeOf(S.uid,S.me),Date.now()); S.pos={x:st.x,y:st.y};
  S.cam.x=isoX(S.pos.x,S.pos.y); S.cam.y=isoY(S.pos.x,S.pos.y); S.cam.z=Math.max(S.cam.z,1.5); S.follow=true;
  $("buildBtn").hidden=false; $("rate").hidden=false;
  setHint(matchMedia("(pointer:coarse)").matches?"Tap to walk, tap a building to visit it. Pinch to zoom, drag to look around.":"WASD or click to walk · Shift runs · E does the activity · B opens Build");
  setTimeout(()=>{ if (!S.build) setHint(""); },9000);
  toast("Welcome to town, "+S.me.name);
}
async function boot(){
  setBuildings([]); rebuildRoads();
  S.cam.x=isoX(TOWN.x*T,TOWN.y*T); S.cam.y=isoY(TOWN.x*T,TOWN.y*T);
  requestAnimationFrame(tick); renderLogin("loading");
  const use=n=>(window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)).catch(()=>null);
  const [db,user,room]=await Promise.all([use("db"),use("user"),use("room")]);
  S.user=user; const uid=user?await user.id():null;
  if (!db||!uid){ startSolo(); return; }
  S.db=db; S.uid=uid; S.solo=false;
  if (user&&(await user.can("data.write"))===false) S.canWrite=false;
  if (room){ S.room=room; wireRoom(room); }
  let first=false;
  const timer=setTimeout(()=>{ if (!first){ S.dataNote="The shared town hasn't answered yet, so this may be out of date."; toast("Still connecting to the shared town…"); } },10000);
  db.collection("players").onSnapshot(snap=>{
    const next={};
    for (const d of snap.docs){ const v=d.data(); if (v&&typeof v.name==="string") next[d.id]={name:v.name.slice(0,18),color:safeColor(v.color),credits:+v.credits||0,earned:+v.earned||0,tasks:+v.tasks||0,home:v.home&&Number.isFinite(v.home.x)?{x:v.home.x,y:v.home.y}:null,created:v.created}; }
    if (S.me&&S.playing) next[S.uid]=S.me;
    S.players=next; destCache=new Map();
    if (!snap.metadata.fromCache&&!first){ first=true; clearTimeout(timer); S.dataNote="";
      if (!S.me&&next[S.uid]) S.me=Object.assign({},next[S.uid]); if (S.me) S.players[S.uid]=S.me;
      if (!S.playing) renderLogin(S.canWrite||S.me?"ready":"readonly"); }
  },()=>{ clearTimeout(timer); if (!S.playing) startSolo(); });
  db.collection("buildings").onSnapshot(snap=>{ setBuildings(snap.docs.map(d=>Object.assign({id:d.id},d.data()))); if (S.sheet&&S.sheet.kind==="building") showBuilding(S.sheet.id); if (S.build) renderDrawer(); },()=>{});
  db.collection("roads").onSnapshot(snap=>{ const r={}; for (const d of snap.docs){ const v=d.data(); if (v&&Array.isArray(v.t)) r[d.id]=v.t.filter(n=>Number.isInteger(n)&&n>=0&&n<CH*CH); } S.dbRoads=r; rebuildRoads(); },()=>{});
}
function startSolo(){
  S.solo=true; S.db=null; loadSolo();
  S.me=soloState.me?Object.assign({},soloState.me):null; S.dbRoads=soloState.roads||{}; rebuildRoads(); setBuildings(soloState.buildings||[]);
  S.uid="solo"; if (S.me) S.players.solo=S.me; renderLogin("ready");
}
function wireRoom(room){
  room.onPeers(ch=>{ const now=Date.now();
    for (const p of ch.peers){ if (p.sameTab) continue; const pr=p.presence||{}, id=p.by||(typeof pr.pid==="string"?pr.pid:null); if (!id||!Number.isFinite(pr.x)||!Number.isFinite(pr.y)) continue;
      S.online[id]={x:Math.max(0,Math.min(WORLD,pr.x)),y:Math.max(0,Math.min(WORLD,pr.y)),act:typeof pr.act==="string"?pr.act.slice(0,60):null,walking:!!pr.walking,seen:now}; }
    for (const p of ch.left){ const id=p.by||(p.presence&&p.presence.pid); if (id&&S.online[id]) delete S.online[id]; }
  },()=>{});
  setInterval(()=>{ const now=Date.now(); for (const p of room.peers()){ if (p.sameTab) continue; const id=p.by||(p.presence&&p.presence.pid); if (id&&S.online[id]) S.online[id].seen=now; } },5000);
}
boot();
</script>
