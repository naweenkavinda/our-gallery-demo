<title>Our Place</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a full-screen living map, with a HUD floating at the four corners and one context card at the bottom. A single dark "dusk HUD" look over a bright world. */
:root{
  --ink:#0f1a22; --panel:#16252f; --panel-2:#1e3240; --line:#2c4555;
  --text:#eef4f1; --muted:#9db3b9; --gold:#f4b740; --leaf:#62c98d; --bad:#ef6b5b; --sky:#7cc3e8;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
#game.placing{cursor:crosshair;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.hud{position:fixed;z-index:5;display:flex;gap:8px;pointer-events:none;}
.hud>*{pointer-events:auto;}
.tl{top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));flex-direction:column;align-items:flex-start;}
.tr{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));flex-wrap:wrap;justify-content:flex-end;max-width:62vw;}
.br{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));}
.chip{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 6px 20px rgb(0 0 0/.35);backdrop-filter:blur(6px);}
.me{display:flex;align-items:center;gap:10px;}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgb(255 255 255/.25);}
.me b{font-family:var(--display);font-size:18px;line-height:1;}
.credits{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:20px;display:flex;align-items:baseline;gap:8px;}
.credits small{font-size:11px;color:var(--muted);font-weight:500;}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgb(0 0 0/.3);}
.btn:hover{border-color:var(--sky);}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:#ffd27a;}
.btn.ghost{background:transparent;box-shadow:none;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.people{display:flex;flex-direction:column;gap:4px;font-size:13px;max-width:220px;}
.people .row{display:flex;align-items:center;gap:8px;}
.people .row .st{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;}
.people .row .st.on{color:var(--leaf);}
.mode{font-size:11px;color:var(--muted);max-width:240px;}
#mini{width:150px;height:150px;border-radius:12px;border:1px solid var(--line);display:block;cursor:pointer;box-shadow:0 6px 20px rgb(0 0 0/.4);}
#card{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100vw - 32px));}
#card .chip{padding:14px 16px;display:grid;gap:10px;}
#card h3{margin:0;font-family:var(--display);font-size:22px;line-height:1.1;text-wrap:balance;}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 8px;}
.tag.good{color:var(--leaf);border-color:color-mix(in srgb,var(--leaf) 50%,var(--line));}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.act .btn{flex:1;}
.bar{height:10px;background:var(--ink);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--gold));}
#toast{position:fixed;z-index:9;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:6px;pointer-events:none;}
#toast div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;animation:pop .25s ease-out;box-shadow:0 8px 20px rgb(0 0 0/.4);}
#toast .plus{color:var(--gold);font-family:var(--mono);}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgb(8 14 19/.72);backdrop-filter:blur(3px);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto;}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(560px,100%);box-shadow:0 20px 60px rgb(0 0 0/.5);display:grid;gap:14px;}
.sheet h1{margin:0;font-family:var(--display);font-size:clamp(34px,7vw,48px);line-height:.95;letter-spacing:-.01em;}
.sheet h2{margin:0;font-family:var(--display);font-size:26px;}
.sheet p{margin:0;color:var(--muted);line-height:1.5;max-width:60ch;}
label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
input[type=text]{width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:600 18px var(--body);}
.swatches{display:flex;flex-wrap:wrap;gap:8px;}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;}
.swatches button[aria-pressed=true]{border-color:var(--text);}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.shop{width:min(820px,100%);max-height:calc(100% - 20px);grid-template-rows:auto auto 1fr;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted);}
.tabs button[aria-pressed=true]{background:var(--sky);color:#06202d;border-color:var(--sky);}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;overflow:auto;min-height:0;padding-right:4px;}
.item{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;text-align:left;}
.item:hover:not([disabled]){border-color:var(--gold);}
.item canvas{width:100%;height:84px;border-radius:8px;background:var(--ink);}
.item b{font-family:var(--display);font-size:17px;line-height:1.1;}
.item .s{font-size:12px;color:var(--muted);line-height:1.35;}
.item .p{font-family:var(--mono);color:var(--gold);font-weight:700;}
.item[disabled]{opacity:.5;cursor:not-allowed;}
#placebar{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 32px));}
#placebar .chip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#placebar .txt{flex:1;min-width:150px;font-size:14px;}
#placebar .txt b{font-family:var(--display);font-size:17px;}
.hint{font-size:12px;color:var(--muted);}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;}
@media (max-width:640px){
  #mini{width:104px;height:104px;}
  .people{display:none;}
  .tr .btn{padding:8px 10px;font-size:13px;}
  .credits{font-size:17px;}
}
@media (prefers-reduced-motion:reduce){#toast div{animation:none;}}
</style>

<canvas id="game" aria-label="City map"></canvas>

<div class="hud tl">
  <div class="chip me" id="meChip" hidden>
    <span class="dot" id="meDot"></span>
    <div>
      <b id="meName">You</b>
      <div class="credits"><span id="credits">0</span><small id="rate">+1 / sec</small></div>
    </div>
  </div>
  <div class="chip clock" id="clock">Day 1 · 08:00</div>

</div>

<div class="hud tr">

<div class="overlay" id="login">
  <div class="sheet">
    <h1>Our Place</h1>
    <p>A shared town for two. Name your character and they will live here around the clock, working, reading and playing on their own. When you are here, you are the one steering.</p>
    <div id="loginBody"><p>Opening the town…</p></div>
  </div>
</div>

<div class="overlay" id="shop" hidden>
  <div class="sheet shop">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">

    <div style="display:flex;justify-content:space-between;align-items:center"><h2>City</h2><button class="btn ghost" id="statsClose">Close</button></div>
    <div id="statsBody"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   WORLD CONSTANTS
   ============================================================ */
const W = 256, H = 256, T = 16;           // tiles, world units per tile
const WORLD = W * T;
const CH = 16;                             // chunk size in tiles
const SEED = 7331;
const BIOMES = ["Barren land", "Forest", "Desert"];
const DAY_MS = 12 * 60 * 1000;            // one in-game day = 12 real minutes
const EPOCH = Date.UTC(2026, 10, 1);
const START_CREDITS = 500;
const ROAD_PRICE = 5;
const COLORS = ["#ef6b5b","#f4b740","#62c98d","#7cc3e8","#b48cf2","#f28cc5","#4fd1c5","#ffffff"];

/* Building catalogue. Each entry: shop category, footprint in tiles,
   price, activity, seconds, credits, look, and where it may be built. */
const TYPES = {
  townhall:   {name:"Town Hall",     cat:"Services", size:[4,3], price:0,    act:"Do the paperwork", verb:"Doing paperwork",   secs:6,  reward:30, style:"dome",  wall:"#ded6c4", roof:"#4f78a3", H:24, starter:true},
  cottage:    {name:"Cottage",       cat:"Homes",    size:[2,2], price:150,  act:"Take a nap",       verb:"Napping",           secs:5,  reward:8,  style:"gable", wall:"#ead9b4", roof:"#b8583a", H:10, residents:2},
  apartment:  {name:"Apartments",    cat:"Homes",    size:[3,3], price:450,  act:"Tidy up",          verb:"Tidying up",        secs:6,  reward:14, style:"flat",  wall:"#c7ccd6", roof:"#626b80", H:28, residents:4},
  cafe:       {name:"Café",          cat:"Fun",      size:[2,2], price:220,  act:"Grab a coffee",    verb:"Having coffee",     secs:5,  reward:14, style:"awning",wall:"#f1e2c6", roof:"#2f7a63", H:10, leisure:true},
  playground: {name:"Playground",    cat:"Fun",      size:[2,2], price:150,  act:"Play",             verb:"Playing",           secs:5,  reward:12, style:"playground", leisure:true},
  park:       {name:"Park",          cat:"Fun",      size:[3,3], price:120,  act:"Go for a walk",    verb:"Strolling",         secs:5,  reward:10, style:"park", leisure:true},
  gym:        {name:"Gym",           cat:"Fun",      size:[3,2], price:450,  act:"Work out",         verb:"Working out",       secs:7,  reward:28, style:"flat",  wall:"#9fb3c4", roof:"#2e4357", H:14},
  cinema:     {name:"Cinema",        cat:"Fun",      size:[3,3], price:550,  act:"Watch a film",     verb:"Watching a film",   secs:8,  reward:26, style:"flat",  wall:"#7a4b7f", roof:"#3d2440", H:20, leisure:true},
  library:    {name:"Library",       cat:"Learning", size:[3,3], price:400,  act:"Read books",       verb:"Reading",           secs:6,  reward:25, style:"gable", wall:"#d9c5a1", roof:"#7a3b2e", H:16},
  school:     {name:"School",        cat:"Learning", size:[4,3], price:700,  act:"Study",            verb:"Studying",          secs:7,  reward:32, style:"gable", wall:"#e6cc9c", roof:"#a5473a", H:16},
  office:     {name:"Office",        cat:"Work",     size:[3,3], price:600,  act:"Work a shift",     verb:"Working",           secs:8,  reward:40, style:"flat",  wall:"#b7c8d8", roof:"#3c556f", H:34},
  market:     {name:"Market",        cat:"Work",     size:[3,2], price:300,  act:"Sell goods",       verb:"Selling goods",     secs:6,  reward:22, style:"awning",wall:"#f0d6a8", roof:"#c9493a", H:10},
  factory:    {name:"Factory",       cat:"Work",     size:[4,3], price:900,  act:"Run the line",     verb:"On the line",       secs:10, reward:60, style:"factory",wall:"#b8a597", roof:"#6c5444", H:18},
  hospital:   {name:"Hospital",      cat:"Services", size:[4,4], price:1200, act:"Volunteer",        verb:"Volunteering",      secs:10, reward:55, style:"flat",  wall:"#eef1f2", roof:"#c9d2d6", H:30, cross:true},
  fire:       {name:"Fire Station",  cat:"Services", size:[3,2], price:650,  act:"Run a drill",      verb:"Running a drill",   secs:8,  reward:35, style:"flat",  wall:"#d2513f", roof:"#7d2b21", H:14},
  farm:       {name:"Farm",          cat:"Land",     size:[4,4], price:500,  act:"Harvest",          verb:"Harvesting",        secs:9,  reward:45, style:"farm",  biome:[0,1]},
  mine:       {name:"Mine",          cat:"Land",     size:[3,3], price:800,  act:"Dig for ore",      verb:"Digging",           secs:10, reward:62, style:"mine",  biome:[0]},
  sawmill:    {name:"Sawmill",       cat:"Land",     size:[3,3], price:700,  act:"Cut timber",       verb:"Cutting timber",    secs:9,  reward:50, style:"gable", wall:"#a27a52", roof:"#5c3d22", H:14, biome:[1]},
  cabin:      {name:"Forest Cabin",  cat:"Land",     size:[2,2], price:250,  act:"Light a campfire", verb:"By the campfire",   secs:6,  reward:18, style:"gable", wall:"#8b5a35", roof:"#3f5b33", H:10, biome:[1], residents:2},
  ranger:     {name:"Ranger Tower",  cat:"Land",     size:[2,2], price:350,  act:"Watch for fires",  verb:"On fire watch",     secs:7,  reward:26, style:"tower", wall:"#8b6a45", roof:"#4d6b3a", H:30, biome:[1]},
  solar:      {name:"Solar Farm",    cat:"Land",     size:[4,4], price:750,  act:"Clean the panels", verb:"Cleaning panels",   secs:7,  reward:38, style:"solar", biome:[2]},
  spa:        {name:"Oasis Spa",     cat:"Land",     size:[3,3], price:600,  act:"Relax in the pool",verb:"Relaxing",          secs:6,  reward:22, style:"dome",  wall:"#f2dfb8", roof:"#3fa7a0", H:14, biome:[2], leisure:true},
  observatory:{name:"Observatory",   cat:"Land",     size:[3,3], price:900,  act:"Stargaze",         verb:"Stargazing",        secs:8,  reward:40, style:"dome",  wall:"#e9e2d4", roof:"#7b8aa6", H:18, biome:[2]},
  bazaar:     {name:"Desert Bazaar", cat:"Land",     size:[3,2], price:400,  act:"Trade spices",     verb:"Trading spices",    secs:6,  reward:24, style:"awning",wall:"#e9c98f", roof:"#c46a2b", H:10, biome:[2]},
};
const SHOP_TABS = ["Homes","Work","Fun","Learning","Services","Land","Roads"];

/* ============================================================
   NOISE + TERRAIN
   ============================================================ */
function hash2(x, y, s){
  let h = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263) ^ Math.imul(s|0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hashStr(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function vnoise(x, y, s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x, y, s){ let t=0, a=.5, f=1; for (let i=0;i<4;i++){ t+=a*vnoise(x*f,y*f,s+i*31); f*=2; a*=.5; } return t/.9375; }

const biome = new Uint8Array(W*H);   // 0 barren, 1 forest, 2 desert
const water = new Uint8Array(W*H);
const deco  = new Uint8Array(W*H);   // 0 none, 1 tree, 2 rock, 3 cactus, 4 shrub, 5 pine
const shade = new Float32Array(W*H);
const road  = new Uint8Array(W*H);
const TOWN = {x: Math.round(W*.37), y: Math.round(H*.5)};

(function genTerrain(){
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x;
    const wx = x + (fbm(x/38, y/38, SEED)-.5)*46;
    const wy = y + (fbm(x/38+50, y/38+50, SEED+1)-.5)*46;
    const b = wx < W*.37 ? 0 : (wy < H*.5 ? 1 : 2);
    biome[i]=b;
    shade[i]=fbm(x/9, y/9, SEED+5);
    const dTown = Math.hypot(x-TOWN.x, y-TOWN.y);
    const wn = fbm(x/24, y/24, SEED+9);
    if (dTown > 26 && x>2 && y>2 && x<W-3 && y<H-3){
      if (b===1 && wn < .25) water[i]=1;
      else if (b===2 && wn < .17) water[i]=1;
      else if (b===0 && fbm(x/14,y/14,SEED+12) < .13) water[i]=1;
    }
    if (water[i]) continue;
    const r = hash2(x, y, SEED+3);
    const dense = fbm(x/16, y/16, SEED+4);
    if (dTown < 14) continue;
    if (b===1){ if (r < .18 + dense*.45) deco[i] = r < .3 ? 5 : 1; else if (r > .97) deco[i]=4; }
    else if (b===0){ if (r < .045) deco[i]=2; else if (r < .085) deco[i]=4; }
    else { if (r < .03) deco[i]=3; else if (r < .045) deco[i]=2; }
  }
})();

/* Starter town: two crossing avenues and one of a few basics, so the city works on day one. */
const STARTER = [
  ["s0","townhall", -2, -5],
  ["s1","cafe",      4, -4],
  ["s2","library",   7, -5],
  ["s3","office",  -7, -5],
  ["s4","park",     -6,  2],
  ["s5","playground",4,  2],
  ["s6","market",    7,  2],
  ["s7","cottage", -10, 2],
  ["s8","cottage", -13, 2],
  ["s9","school",  -12,-5],
  ["s10","apartment",11,-5],
  ["s11","cottage",  11, 2],
];
for (let x=TOWN.x-30; x<=TOWN.x+30; x++) road[TOWN.y*W+x]=1;
for (let y=TOWN.y-22; y<=TOWN.y+22; y++) road[y*W+TOWN.x+1]=1;
for (let x=TOWN.x-16; x<=TOWN.x+16; x++){ road[(TOWN.y-7)*W+x]=1; road[(TOWN.y+5)*W+x]=1; }
const starterRoad = road.slice();

/* ============================================================
   STATE
   ============================================================ */
const S = {
  db:null, user:null, room:null,
  uid:null, solo:true, canWrite:true,
  me:null,                // my player record {name,color,credits,...}
  players:{},             // id -> record
  buildings:[],           // [{id,type,x,y,by,at,starter}]
  dbRoads:{},             // chunkKey -> [indices]
  online:{},              // id -> {x,y,act,peerAt}
  pos:{x:0,y:0}, target:null, keys:{}, playing:false,
  task:null,              // {b, start, secs, reward}
  cam:{x:TOWN.x*T, y:TOWN.y*T, z:1.4}, follow:true,
  place:null,             // {type} or {road:true, tiles:Set}
  ghost:null,
  pendingCredits:0, saveChain:Promise.resolve(), lastSaved:null,
  dataNote:"",
};
const occ = new Int32Array(W*H).fill(-1);
let destCache = new Map();
let npcs = [];

function tileAt(wx, wy){ return {x: Math.floor(wx/T), y: Math.floor(wy/T)}; }
function inMap(x,y){ return x>=0 && y>=0 && x<W && y<H; }

function rebuildCity(){
  occ.fill(-1);
  S.buildings.forEach((b, idx) => {
    const t = TYPES[b.type]; const [w,h]=t.size;
    for (let y=b.y;y<b.y+h;y++) for (let x=b.x;x<b.x+w;x++) if (inMap(x,y)) occ[y*W+x]=idx;
  });
  // homes -> townsfolk
  npcs = [];
  const homes = S.buildings.filter(b => TYPES[b.type].residents);
  for (const hb of homes){
    for (let k=0;k<TYPES[hb.type].residents && npcs.length<160;k++){
      const id = "npc-"+hb.id+"-"+k;
      npcs.push({id, home:hb, name:NPC_NAMES[hashStr(id)%NPC_NAMES.length], color:NPC_COLORS[hashStr(id+"c")%NPC_COLORS.length]});
    }
  }
  destCache = new Map();
  chunkCache.clear(); overviewDirty = true;
}
function rebuildRoads(){
  road.set(starterRoad);
  for (const key in S.dbRoads){
    const m = /^r_(\d+)_(\d+)$/.exec(key); if (!m) continue;
    const cx=+m[1], cy=+m[2];
    for (const li of S.dbRoads[key]){
      const lx = li%CH, ly = Math.floor(li/CH), x=cx*CH+lx, y=cy*CH+ly;
      if (inMap(x,y)) road[y*W+x]=1;
    }
  }
  chunkCache.clear(); overviewDirty = true;
}
function setBuildings(list){
  const starters = STARTER.map(([id,type,dx,dy]) => ({id, type, x:TOWN.x+dx, y:TOWN.y+dy, by:null, starter:true}));
  const seen = new Set();
  const valid = [];
  for (const b of list){
    if (!TYPES[b.type] || TYPES[b.type].starter) continue;
    if (!Number.isInteger(b.x) || !Number.isInteger(b.y) || !inMap(b.x,b.y)) continue;
    if (seen.has(b.id)) continue; seen.add(b.id); valid.push(b);
  }
  valid.sort((a,b)=>(a.at||0)-(b.at||0) || (a.id<b.id?-1:1));
  S.buildings = starters.concat(valid);
  rebuildCity();
}

/* ============================================================
   BONUSES (borrowed from city builders: service radius + road access)
   ============================================================ */
function bonusFor(b){
  const t = TYPES[b.type]; const [w,h]=t.size;
  const cx=b.x+w/2, cy=b.y+h/2;
  let leisure=0;
  for (const o of S.buildings){
    if (o===b || !TYPES[o.type].leisure) continue;
    const ot=TYPES[o.type];
    if (Math.hypot(o.x+ot.size[0]/2-cx, o.y+ot.size[1]/2-cy) <= 10) leisure++;
  }
  let roadOk=false;
  for (let x=b.x-1;x<=b.x+w && !roadOk;x++) for (let y=b.y-1;y<=b.y+h;y++){
    if (inMap(x,y) && road[y*W+x] && (x<b.x||x>=b.x+w||y<b.y||y>=b.y+h)){ roadOk=true; break; }
  }
  const pct = Math.min(30, leisure*5) + (roadOk?10:0);
  return {pct, leisure, roadOk};
}

/* ============================================================
   AUTONOMOUS LIFE (deterministic: every viewer sees the same thing)
   ============================================================ */
const SLOT = 45000, WALK = 70;
const NPC_NAMES = ["Ari","Bo","Cleo","Dev","Esi","Fen","Gus","Hana","Ivo","Juno","Kiri","Lio","Mae","Nell","Oki","Pia","Quin","Rumi","Sol","Tavi","Uma","Vic","Wren","Yara","Zed"];
const NPC_COLORS = ["#d98c5f","#8fb3d9","#a3c98f","#d9c38f","#b7a3d9","#d99fb7","#8fd0c8","#c9a27a"];

function homeOf(id, rec){
  if (rec && rec.home) return rec.home;
  return {x:TOWN.x, y:TOWN.y};
}
function candidatesFor(id, home){
  let c = destCache.get(id);
  if (c) return c;
  const scored = S.buildings.map(b => {
    const t = TYPES[b.type];
    return {b, d: Math.hypot(b.x+t.size[0]/2-home.x, b.y+t.size[1]/2-home.y) + hash2(hashStr(id)&65535, hashStr(b.id)&65535, 3)*14};
  }).sort((a,b)=>a.d-b.d);
  c = scored.slice(0, 12).map(s=>s.b);
  destCache.set(id, c);
  return c;
}
function door(b){ const t=TYPES[b.type]; return {x:(b.x+t.size[0]/2)*T, y:(b.y+t.size[1])*T+5}; }
function destAt(id, home, k){
  const c = candidatesFor(id, home);
  if (!c.length) return null;
  return c[Math.floor(hash2(hashStr(id)&0xffffff, k, 11) * c.length)];
}
function autoState(id, home, now){
  const k = Math.floor(now/SLOT);
  const a = destAt(id, home, k-1), b = destAt(id, home, k);
  if (!a || !b) return {x:home.x*T, y:home.y*T, act:null};
  const p0 = door(a), p1 = door(b);
  const el = (now - k*SLOT)/1000 * WALK;
  const dx = p1.x-p0.x, dy = p1.y-p0.y, d = Math.abs(dx)+Math.abs(dy);
  if (el >= d) return {x:p1.x + Math.sin(now/900+hashStr(id))*3, y:p1.y, act:TYPES[b.type].verb+" at "+TYPES[b.type].name, b, walking:false};
  // L-shaped walk along x first, then y
  if (el < Math.abs(dx)) return {x:p0.x+Math.sign(dx)*el, y:p0.y, act:null, walking:true, dir:Math.sign(dx)};
  return {x:p1.x, y:p0.y+Math.sign(dy)*(el-Math.abs(dx)), act:null, walking:true, dir:0};
}

const cvs = document.getElementById("game");

const GROUND = [
  ["#b49a78","#a68a68","#c2a987"],   // barren: dusty clay
  ["#4f8a4a","#457d41","#5a9653"],   // forest floor
  ["#e7c98e","#dcbb7d","#efd6a2"],   // desert sand
];
function groundColor(i){ const g=GROUND[biome[i]]; const s=shade[i]; return s<.42?g[1]:(s>.6?g[2]:g[0]); }

const chunkCache = new Map();
function getChunk(cx, cy, res){
  const key = cx+","+cy+","+res;
  let c = chunkCache.get(key);
  if (c){ chunkCache.delete(key); chunkCache.set(key, c); return c; }
  c = document.createElement("canvas");
  const px = CH*T*res; c.width = c.height = px;
  drawChunk(c.getContext("2d"), cx, cy, res);
  chunkCache.set(key, c);
  const limit = res===2 ? 48 : 140;
  let count=0; for (const k of chunkCache.keys()) if (k.endsWith(","+res)) count++;
  if (count > limit){ for (const k of chunkCache.keys()){ if (k.endsWith(","+res)){ chunkCache.delete(k); break; } } }
  return c;
}
function drawChunk(g, cx, cy, r){
  g.scale(r, r);
  for (let ly=0; ly<CH; ly++) for (let lx=0; lx<CH; lx++){
    const x=cx*CH+lx, y=cy*CH+ly, i=y*W+x, X=lx*T, Y=ly*T;
    if (water[i]){
      g.fillStyle = biome[i]===2 ? "#3fb3b0" : "#3b84b8"; g.fillRect(X,Y,T,T);
      g.fillStyle = "rgba(255,255,255,.18)";
      if (hash2(x,y,77)<.25) g.fillRect(X+3,Y+5+(x%3),6,1.5);
      // shore
      g.fillStyle = biome[i]===2 ? "#f1dcae" : "#c8b98b";
      if (y>0 && !water[i-W]) g.fillRect(X,Y,T,2);
      if (y<H-1 && !water[i+W]) g.fillRect(X,Y+T-2,T,2);
      if (x>0 && !water[i-1]) g.fillRect(X,Y,2,T);
      if (x<W-1 && !water[i+1]) g.fillRect(X+T-2,Y,2,T);
      continue;
    }
    g.fillStyle = groundColor(i); g.fillRect(X,Y,T,T);
    const h = hash2(x,y,21);
    if (biome[i]===2){ g.fillStyle="rgba(170,120,60,.16)"; g.fillRect(X, Y+((x*3+y*5)%T), T, 1.5); }
    else if (biome[i]===0 && h<.12){ g.strokeStyle="rgba(80,60,40,.35)"; g.lineWidth=.8; g.beginPath(); g.moveTo(X+2,Y+4+h*40); g.lineTo(X+8,Y+8); g.lineTo(X+13,Y+6+h*30); g.stroke(); }
    else if (biome[i]===1 && h<.3){ g.fillStyle="rgba(30,70,30,.25)"; g.fillRect(X+h*40%12,Y+(h*90)%12,2,2); }
    if (road[i]) { drawRoadTile(g, x, y, X, Y); continue; }
    drawDeco(g, deco[i], X, Y, h);
  }
}
function drawRoadTile(g, x, y, X, Y){
  g.fillStyle="#56595e"; g.fillRect(X,Y,T,T);
  const n = y>0&&road[(y-1)*W+x], s = y<H-1&&road[(y+1)*W+x], w = x>0&&road[y*W+x-1], e = x<W-1&&road[y*W+x+1];
  g.fillStyle="#6b6f75";
  if (!n) g.fillRect(X,Y,T,2); if (!s) g.fillRect(X,Y+T-2,T,2);
  if (!w) g.fillRect(X,Y,2,T); if (!e) g.fillRect(X+T-2,Y,2,T);
  g.fillStyle="#e9d27a";
  const horiz = (w||e) && !(n||s), vert = (n||s) && !(w||e);
  if (horiz && x%2===0) g.fillRect(X+3,Y+T/2-.6,T-6,1.2);
  if (vert && y%2===0) g.fillRect(X+T/2-.6,Y+3,1.2,T-6);
}
function drawDeco(g, d, X, Y, h){
  const ox = X + 3 + h*6, oy = Y + 3 + (h*97%1)*6;
  if (d===1){ g.fillStyle="rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(ox+6,oy+10,6,3,0,0,7); g.fill();
    g.fillStyle="#2f6b35"; g.beginPath(); g.arc(ox+5,oy+5,6.5,0,7); g.fill();
    g.fillStyle="#3f8a42"; g.beginPath(); g.arc(ox+4,oy+3.5,4,0,7); g.fill(); }
  else if (d===5){ g.fillStyle="rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(ox+6,oy+11,5,2.5,0,0,7); g.fill();
    g.fillStyle="#24563a"; g.beginPath(); g.moveTo(ox+5,oy-3); g.lineTo(ox+11,oy+10); g.lineTo(ox-1,oy+10); g.closePath(); g.fill();
    g.fillStyle="#2f6e48"; g.beginPath(); g.moveTo(ox+5,oy-3); g.lineTo(ox+8,oy+5); g.lineTo(ox+2,oy+5); g.closePath(); g.fill(); }
  else if (d===2){ g.fillStyle="#8d8579"; g.beginPath(); g.ellipse(ox+5,oy+7,5,3.5,0,0,7); g.fill(); g.fillStyle="#a8a093"; g.beginPath(); g.ellipse(ox+4,oy+6,3,2,0,0,7); g.fill(); }
  else if (d===3){ g.fillStyle="#4c8a4b"; g.fillRect(ox+4,oy,3,11); g.fillRect(ox+1,oy+3,2,5); g.fillRect(ox+8,oy+2,2,5); g.fillRect(ox+1,oy+7,4,1.5); g.fillRect(ox+6,oy+6,4,1.5); }
  else if (d===4){ g.fillStyle="#6f7d45"; g.beginPath(); g.arc(ox+5,oy+7,3.5,0,7); g.arc(ox+8,oy+8,2.5,0,7); g.fill(); }
}

/* ============================================================
   RENDERING: BUILDINGS + PEOPLE
   ============================================================ */
function shadeHex(hex, k){
  const n=parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*k))); g=Math.max(0,Math.min(255,Math.round(g*k))); b=Math.max(0,Math.min(255,Math.round(b*k)));
  return "rgb("+r+","+g+","+b+")";
}
function drawBuilding(g, type, X, Y, night, z){
  const t=TYPES[type]; const Wd=t.size[0]*T, D=t.size[1]*T;
  const pad=1.5;
  if (t.style==="park"||t.style==="playground"||t.style==="farm"||t.style==="solar"||t.style==="mine"){
    drawGroundBuilding(g, t, X, Y, Wd, D); return;
  }
  const Hf = Math.min(t.H*.55, D*.42);
  // shadow
  g.fillStyle="rgba(0,0,0,.22)"; g.fillRect(X+pad+4, Y+pad+4, Wd-pad*2, D-pad*2);
  // walls (front face)
  g.fillStyle = shadeHex(t.wall, .82); g.fillRect(X+pad, Y+D-pad-Hf, Wd-pad*2, Hf);
  // windows
  const cols = Math.max(2, Math.floor((Wd-6)/9));
  for (let c=0;c<cols;c++){
    const wx = X+pad+4+c*((Wd-pad*2-8)/cols);
    g.fillStyle = night ? (hash2(X|0,c,5)>.35?"#ffd77a":"#3b4b5c") : "#5c7f9a";
    g.fillRect(wx, Y+D-pad-Hf+3, 4, Math.max(2,Hf*.35));
  }
  // door
  g.fillStyle = shadeHex(t.wall,.45); g.fillRect(X+Wd/2-3, Y+D-pad-Math.min(8,Hf*.7), 6, Math.min(8,Hf*.7));
  // roof
  const rh = D-pad*2-Hf;
  if (t.style==="gable"){
    g.fillStyle = shadeHex(t.roof, 1.12); g.fillRect(X+pad, Y+pad, Wd-pad*2, rh/2);
    g.fillStyle = t.roof; g.fillRect(X+pad, Y+pad+rh/2, Wd-pad*2, rh/2);
    g.fillStyle = shadeHex(t.roof, .7); g.fillRect(X+pad, Y+pad+rh/2-.7, Wd-pad*2, 1.4);  } else if (t.style==="dome"){
    g.fillStyle = t.wall; g.fillRect(X+pad, Y+pad, Wd-pad*2, rh);
    g.fillStyle = t.roof; g.beginPath(); g.ellipse(X+Wd/2, Y+pad+rh*.55, Math.min(Wd,rh*1.6)*.36, rh*.42, 0, 0, 7); g.fill();
    g.fillStyle = shadeHex(t.roof,1.3); g.beginPath(); g.ellipse(X+Wd/2-3, Y+pad+rh*.42, Math.min(Wd,rh*1.6)*.12, rh*.13, 0, 0, 7); g.fill();
  } else if (t.style==="awning"){
    g.fillStyle = t.wall; g.fillRect(X+pad, Y+pad, Wd-pad*2, rh);
    const stripes = Math.max(4, Math.floor(Wd/5));
    for (let i=0;i<stripes;i++){ g.fillStyle = i%2? "#fff6e6" : t.roof; g.fillRect(X+pad+i*(Wd-pad*2)/stripes, Y+pad+rh*.55, (Wd-pad*2)/stripes+.3, rh*.45); }
  } else if (t.style==="tower"){
    g.fillStyle = shadeHex(t.wall,.7); g.fillRect(X+Wd*.3, Y+pad+rh*.3, 2, rh*.7); g.fillRect(X+Wd*.7-2, Y+pad+rh*.3, 2, rh*.7);
    g.fillStyle = t.roof; g.beginPath(); g.moveTo(X+Wd/2, Y+pad); g.lineTo(X+Wd*.85, Y+pad+rh*.45); g.lineTo(X+Wd*.15, Y+pad+rh*.45); g.closePath(); g.fill();
  } else { // flat + factory
    g.fillStyle = t.roof; g.fillRect(X+pad, Y+pad, Wd-pad*2, rh);
    g.strokeStyle = shadeHex(t.roof, 1.35); g.lineWidth=1; g.strokeRect(X+pad+1.5, Y+pad+1.5, Wd-pad*2-3, rh-3);
    g.fillStyle = shadeHex(t.roof, .75); g.fillRect(X+Wd*.62, Y+pad+4, 6, 5);
    if (t.style==="factory"){ g.fillStyle="#8a6b55"; g.fillRect(X+8, Y-6, 5, rh*.7+6); g.fillStyle="rgba(220,220,220,.5)"; g.beginPath(); g.arc(X+10, Y-9-((performance.now()/120)%8), 4, 0, 7); g.fill(); }
    if (t.cross){ g.fillStyle="#d93b3b"; g.fillRect(X+Wd/2-2, Y+pad+rh/2-7, 4, 14); g.fillRect(X+Wd/2-7, Y+pad+rh/2-2, 14, 4); }
  }
}
function drawGroundBuilding(g, t, X, Y, Wd, D){
  if (t.style==="park"){
    g.fillStyle="#76b866"; g.fillRect(X+1,Y+1,Wd-2,D-2);
    g.strokeStyle="#e3d5ad"; g.lineWidth=3; g.beginPath(); g.moveTo(X+2,Y+D/2); g.quadraticCurveTo(X+Wd/2,Y+4,X+Wd-2,Y+D/2); g.stroke();
    for (const [a,b] of [[.25,.7],[.75,.72],[.5,.35]]){ g.fillStyle="#2f6b35"; g.beginPath(); g.arc(X+Wd*a,Y+D*b,6,0,7); g.fill(); g.fillStyle="#46924a"; g.beginPath(); g.arc(X+Wd*a-1.5,Y+D*b-1.5,3.5,0,7); g.fill(); }
    g.fillStyle="#3b8fc0"; g.beginPath(); g.arc(X+Wd*.72,Y+D*.3,4,0,7); g.fill();
  } else if (t.style==="playground"){
    g.fillStyle="#e3b06b"; g.fillRect(X+1,Y+1,Wd-2,D-2);
    g.fillStyle="#d9483b"; g.fillRect(X+5,Y+5,8,3); g.fillRect(X+5,Y+5,2,10);
    g.fillStyle="#3b8fc0"; g.fillRect(X+16,Y+16,10,10); g.fillStyle="#f4b740"; g.fillRect(X+18,Y+8,2,10); g.fillRect(X+24,Y+8,2,10); g.fillRect(X+17,Y+8,10,2);
    g.strokeStyle="#7a4b2a"; g.lineWidth=1; g.strokeRect(X+1.5,Y+1.5,Wd-3,D-3);
  } else if (t.style==="farm"){
    g.fillStyle="#8a6a3e"; g.fillRect(X+1,Y+1,Wd-2,D-2);
    for (let r=0;r<D/5-2;r++){ g.fillStyle = r%2? "#c8b04a":"#7fa040"; g.fillRect(X+3, Y+4+r*5, Wd*.6, 3); }
    g.fillStyle="#b8463a"; g.fillRect(X+Wd*.7, Y+D*.2, Wd*.26, D*.34); g.fillStyle="#efe6d6"; g.fillRect(X+Wd*.7, Y+D*.5, Wd*.26, D*.12);
  } else if (t.style==="solar"){
    g.fillStyle="#d8c08d"; g.fillRect(X+1,Y+1,Wd-2,D-2);
    for (let r=0;r<4;r++) for (let c=0;c<3;c++){ g.fillStyle="#2b4a74"; g.fillRect(X+4+c*(Wd-8)/3, Y+4+r*(D-8)/4, (Wd-8)/3-3, (D-8)/4-4); g.fillStyle="rgba(170,210,255,.35)"; g.fillRect(X+4+c*(Wd-8)/3, Y+4+r*(D-8)/4, (Wd-8)/3-3, 2); }
  } else if (t.style==="mine"){
    g.fillStyle="#7d6b58"; g.fillRect(X+1,Y+1,Wd-2,D-2);
    g.fillStyle="#2a221c"; g.beginPath(); g.arc(X+Wd/2, Y+D*.55, Wd*.2, Math.PI, 0); g.fill(); g.fillRect(X+Wd*.3, Y+D*.55, Wd*.4, D*.2);
    g.strokeStyle="#a27a52"; g.lineWidth=2; g.beginPath(); g.arc(X+Wd/2, Y+D*.55, Wd*.22, Math.PI, 0); g.stroke();
    g.fillStyle="#9a9a9a"; g.fillRect(X+4, Y+D-8, Wd-8, 2);
  }
}
function drawPerson(g, x, y, color, name, z, opts){
  const bob = opts.walking ? Math.sin(performance.now()/90)*1.2 : 0;
  g.fillStyle="rgba(0,0,0,.25)"; g.beginPath(); g.ellipse(x, y, 5, 2.2, 0, 0, 7); g.fill();
  if (opts.isMe){ g.strokeStyle="#f4b740"; g.lineWidth=1.5; g.beginPath(); g.ellipse(x, y, 8, 3.6, 0, 0, 7); g.stroke(); }
  g.fillStyle=color; g.beginPath(); g.ellipse(x, y-6+bob, 4.2, 5.5, 0, 0, 7); g.fill();
  g.fillStyle="#f1c9a5"; g.beginPath(); g.arc(x, y-13.5+bob, 3.6, 0, 7); g.fill();
  g.fillStyle=shadeHex(color.startsWith("#")?color:"#888888", .55); g.beginPath(); g.arc(x, y-14.6+bob, 3.7, Math.PI, 0); g.fill();
  if (name && (z>.9 || opts.player)){
    const fs = Math.max(4.5, 11/z);
    g.font = "800 "+fs+"px Nunito Sans, system-ui, sans-serif"; g.textAlign="center";
    const label = name + (opts.away ? " · away" : "");
    const tw = g.measureText(label).width;
    g.fillStyle = opts.player ? "rgba(15,26,34,.85)" : "rgba(15,26,34,.55)";
    const ty = y-20-fs;
    g.fillRect(x-tw/2-3/z*2, ty-fs*.85, tw+6/z*2, fs*1.25);
    g.fillStyle = opts.player ? "#fff" : "#dfe8e4"; g.fillText(label, x, ty);
    if (opts.act && (opts.player || z>2.2)){
      const fs2 = fs*.82; g.font = "600 "+fs2+"px Nunito Sans, system-ui, sans-serif";
      const w2 = g.measureText(opts.act).width;
      g.fillStyle="rgba(244,183,64,.92)"; g.fillRect(x-w2/2-4/z, ty-fs*.85-fs2*1.4, w2+8/z, fs2*1.25);
      g.fillStyle="#2a1d00"; g.fillText(opts.act, x, ty-fs*.85-fs2*.45);
    }
  }
}

function gameTime(now){ const t=(now-EPOCH)/DAY_MS; return {day:Math.floor(t)+1, frac:t-Math.floor(t)}; }
function nightAlpha(frac){ // frac 0 = midnight
  const h = frac*24;
  if (h>=7 && h<=18) return 0;
  if (h>18 && h<21) return (h-18)/3*.42;
  if (h<5 || h>=21) return .42;
  return (7-h)/2*.42;
}
function screenToWorld(sx, sy){ const c=S.cam; return {x:c.x+(sx-innerWidth/2)/c.z, y:c.y+(sy-innerHeight/2)/c.z}; }

function everyone(now){
  const out=[];
  for (const id in S.players){
    const rec=S.players[id]; if (!rec || !rec.name) continue;
    if (id===S.uid && S.playing){ out.push({id, rec, x:S.pos.x, y:S.pos.y, me:true, walking:!!(S.target||anyKey()), act:S.task?TYPES[S.task.b.type].verb+" at "+TYPES[S.task.b.type].name:null}); continue; }
    const live = S.online[id];
    if (live && now-live.seen < 15000){ out.push({id, rec, x:live.x, y:live.y, online:true, walking:live.walking, act:live.act}); continue; }
    const st = autoState(id, homeOf(id, rec), now);
    out.push({id, rec, x:st.x, y:st.y, away:true, walking:st.walking, act:st.act});
  }
  return out;
}

function draw(now){
  const c=S.cam, z=c.z;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#2a4a5c"; ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.setTransform(DPR*z,0,0,DPR*z, DPR*(innerWidth/2-c.x*z), DPR*(innerHeight/2-c.y*z));
  const tl = screenToWorld(0,0), br = screenToWorld(innerWidth, innerHeight);
  // ground
  if (z < .6){
    if (overviewDirty) drawOverview();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(overview, 0, 0, WORLD, WORLD);
  } else {
    const res = z*DPR >= 1.6 ? 2 : 1;
    ctx.imageSmoothingEnabled = true;
    const c0x=Math.max(0,Math.floor(tl.x/(CH*T))), c1x=Math.min(W/CH-1,Math.floor(br.x/(CH*T)));
    const c0y=Math.max(0,Math.floor(tl.y/(CH*T))), c1y=Math.min(H/CH-1,Math.floor(br.y/(CH*T)));
    for (let cy=c0y; cy<=c1y; cy++) for (let cx=c0x; cx<=c1x; cx++){
      ctx.drawImage(getChunk(cx,cy,res), cx*CH*T, cy*CH*T, CH*T+.5, CH*T+.5);
    }
  }
  const gt = gameTime(now), night = nightAlpha(gt.frac);
  // road paint preview
  if (S.place && S.place.road){
    ctx.fillStyle="rgba(244,183,64,.55)";
    for (const i of S.place.tiles){ ctx.fillRect((i%W)*T,Math.floor(i/W)*T,T,T); }
  }
  // collect drawables (buildings + people) and sort by y
  const items=[];
  const margin = 6*T;
  for (const b of S.buildings){
    const t=TYPES[b.type]; const X=b.x*T, Y=b.y*T;
    if (X > br.x+margin || Y > br.y+margin || X+t.size[0]*T < tl.x-margin || Y+t.size[1]*T < tl.y-margin) continue;
    items.push({y:Y+t.size[1]*T, b});
  }
  const ppl = everyone(now);
  for (const p of ppl) items.push({y:p.y, p});
  if (z > .45){
    for (const n of npcs){
      const st = autoState(n.id, {x:n.home.x+1, y:n.home.y+1}, now);
      if (st.x<tl.x-40||st.x>br.x+40||st.y<tl.y-40||st.y>br.y+40) continue;
      items.push({y:st.y, n, st});
    }
  }
  items.sort((a,b)=>a.y-b.y);
  for (const it of items){
    if (it.b) drawBuilding(ctx, it.b.type, it.b.x*T, it.b.y*T, night>.15, z);
    else if (it.n) drawPerson(ctx, it.st.x, it.st.y, it.n.color, z>1.6?it.n.name:null, z, {walking:it.st.walking, act:it.st.act});
    else { const p=it.p; drawPerson(ctx, p.x, p.y, p.rec.color||"#ffffff", p.rec.name, z, {player:true, isMe:p.me, away:p.away, walking:p.walking, act:p.act}); }
  }
  // building names
  if (z > 1.1){
    ctx.textAlign="center";
    const fs=Math.max(4,10/z);
    ctx.font="800 "+fs+"px Nunito Sans, system-ui, sans-serif";
    for (const it of items){ if (!it.b) continue; const t=TYPES[it.b.type];
      const x=(it.b.x+t.size[0]/2)*T, y=(it.b.y+t.size[1])*T+fs+2;
      ctx.fillStyle="rgba(15,26,34,.6)"; const tw=ctx.measureText(t.name).width; ctx.fillRect(x-tw/2-2,y-fs*.85,tw+4,fs*1.15);
      ctx.fillStyle="#f5efe1"; ctx.fillText(t.name, x, y);
    }
  }
  // placement ghost
  if (S.place && S.place.type && S.ghost){
    const t=TYPES[S.place.type]; const ok = canPlace(S.place.type, S.ghost.x, S.ghost.y).ok;
    ctx.globalAlpha=.7; drawBuilding(ctx, S.place.type, S.ghost.x*T, S.ghost.y*T, false, z); ctx.globalAlpha=1;
    ctx.strokeStyle = ok ? "#62c98d" : "#ef6b5b"; ctx.lineWidth = 2/z*1.5;
    ctx.strokeRect(S.ghost.x*T, S.ghost.y*T, t.size[0]*T, t.size[1]*T);
  }
  // night tint
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (night>0){ ctx.fillStyle="rgba(16,24,60,"+night+")"; ctx.fillRect(0,0,innerWidth,innerHeight); }
  drawMini(ppl);
}

const mini = document.getElementById("mini"), mctx = mini.getContext("2d");

function drawMini(ppl){

  mctx.imageSmoothingEnabled=false;
  mctx.drawImage(overview, 0, 0, 300, 300);

/* ============================================================
   PLACEMENT
   ============================================================ */
function canPlace(type, x, y){
  const t=TYPES[type]; const [w,h]=t.size;
  if (x<1||y<1||x+w>W-1||y+h>H-1) return {ok:false, why:"Too close to the edge of the map"};
  for (let yy=y;yy<y+h;yy++) for (let xx=x;xx<x+w;xx++){
    const i=yy*W+xx;
    if (water[i]) return {ok:false, why:"Can't build on water"};
    if (occ[i]>=0) return {ok:false, why:"Something is already built here"};
    if (road[i]) return {ok:false, why:"A road runs through here"};
  }
  if (t.biome){ const bi = biome[(y+(h>>1))*W + x+(w>>1)]; if (!t.biome.includes(bi)) return {ok:false, why:"Only in: "+t.biome.map(b=>BIOMES[b]).join(" or ")}; }
  if ((S.me?.credits||0) < t.price) return {ok:false, why:"Not enough credits"};
  return {ok:true};
}
async function placeBuilding(type, x, y){
  const chk = canPlace(type, x, y);
  if (!chk.ok){ toast(chk.why); return; }
  const t = TYPES[type];
  const rec = {type, x, y, by:S.uid||"solo", at:Date.now()};
  S.me.credits -= t.price; markDirty(true);
  if (S.db){
    try { await S.db.collection("buildings").add(rec); }
    catch(e){ S.me.credits += t.price; markDirty(true); toast(e && e.code==="quota_exceeded" ? "The town is full: the database has no room for more buildings." : "Couldn't save that building. Try again."); return; }
  } else {
    soloState.buildings.push(Object.assign({id:"l"+Date.now()}, rec)); saveSolo(); setBuildings(soloState.buildings);
  }
  toast("Built a "+t.name+"  −"+t.price);
  if (!S.me.home) { S.me.home = {x:x+1, y:y+1}; markDirty(true); }
  endPlace();
}
async function commitRoads(){
  const tiles=[...S.place.tiles]; const cost=tiles.length*ROAD_PRICE;
  if (!tiles.length){ endPlace(); return; }
  if (S.me.credits < cost){ toast("Not enough credits for "+tiles.length+" road tiles"); return; }
  const byChunk={};
  for (const i of tiles){ const x=i%W, y=Math.floor(i/W); const key="r_"+Math.floor(x/CH)+"_"+Math.floor(y/CH); (byChunk[key] ||= []).push((y%CH)*CH + (x%CH)); }
  S.me.credits -= cost; markDirty(true);
  for (const key in byChunk){
    const merged = Array.from(new Set([...(S.dbRoads[key]||[]), ...byChunk[key]])).sort((a,b)=>a-b);
    S.dbRoads[key] = merged;
    if (S.db){ try { await S.db.doc("roads/"+key).set({t:merged}); } catch(e){ toast("Some roads didn't save. Try again."); } }
  }
  if (!S.db){ soloState.roads = S.dbRoads; saveSolo(); }
  rebuildRoads(); toast("Paved "+tiles.length+" road tiles  −"+cost); endPlace();
}
function roadTileOk(i){ return !water[i] && occ[i]<0 && !road[i]; }

function flush(){
  if (!dirty || !S.me) return;
  dirty=false;
  const snap = {name:S.me.name, color:S.me.color, credits:Math.floor(S.me.credits), earned:Math.floor(S.me.earned||0), tasks:S.me.tasks||0, home:S.me.home||null, created:S.me.created||Date.now(), lastSeen:Date.now()};
  if (S.db && S.uid){
    S.saveChain = S.saveChain.then(()=>S.db.doc("players/"+S.uid).set(snap)).catch(()=>{ dirty=true; });
  } else { soloState.me = snap; saveSolo(); }
}

function buildingNear(px, py){
  const tx=px/T, ty=py/T;
  let best=null, bd=1e9;
  for (const b of S.buildings){
    const t=TYPES[b.type]; const [w,h]=t.size;
    const dx = Math.max(b.x-1-tx, 0, tx-(b.x+w+1)), dy = Math.max(b.y-1-ty, 0, ty-(b.y+h+1));
    const d = Math.hypot(dx,dy);
    if (d===0){ const cd=Math.hypot(tx-(b.x+w/2), ty-(b.y+h/2)); if (cd<bd){ bd=cd; best=b; } }
  }
  return best;
}
function startTask(b){
  if (S.task) return;
  const t=TYPES[b.type]; const bon=bonusFor(b);
  S.task = {b, start:performance.now(), secs:t.secs, reward:Math.round(t.reward*(1+bon.pct/100))};
  S.target=null; renderCard(true);
}
function finishTask(){
  const tk=S.task; S.task=null;
  S.me.credits += tk.reward; S.me.earned=(S.me.earned||0)+tk.reward; S.me.tasks=(S.me.tasks||0)+1;
  markDirty(true);
  toast(TYPES[tk.b.type].act+" done", "+"+tk.reward);
  lastCardKey=""; renderCard(true);
}

  const k=e.key.toLowerCase(); S.keys[k]=true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  if (k==="escape"){ if (S.place) endPlace(); closeShop(); $("stats").hidden=true; }
  if (k==="e" && S.playing && !S.task){ const b=buildingNear(S.pos.x,S.pos.y); if (b) startTask(b); }
  if (k==="b" && S.playing) openShop();
  if (anyKey()){ S.target=null; S.follow=true; }
});
addEventListener("keyup", e=>{ S.keys[e.key.toLowerCase()]=false; });
cvs.addEventListener("wheel", e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY*.0015)); }, {passive:false});
function zoomAt(sx, sy, f){
  const before=screenToWorld(sx,sy);
  S.cam.z=Math.max(.18, Math.min(4.5, S.cam.z*f));
  const after=screenToWorld(sx,sy);
  S.cam.x += before.x-after.x; S.cam.y += before.y-after.y;
}
cvs.addEventListener("pointerdown", e=>{
  cvs.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}; drag=null; return; }
  drag={sx:e.clientX, sy:e.clientY, lx:e.clientX, ly:e.clientY, moved:false, painting: !!(S.place&&S.place.road)};
  if (drag.painting) paintAt(e.clientX, e.clientY);
});
cvs.addEventListener("pointermove", e=>{
  if (S.place && S.place.type && e.pointerType==="mouse"){ const w=screenToWorld(e.clientX,e.clientY); const t=TYPES[S.place.type]; const gx=Math.round(w.x/T-t.size[0]/2), gy=Math.round(w.y/T-t.size[1]/2); if (!S.ghost||S.ghost.x!==gx||S.ghost.y!==gy){ S.ghost={x:gx,y:gy}; renderPlacebar(); } }
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); zoomAt((a.x+b.x)/2,(a.y+b.y)/2, d/pinch.d); pinch.d=d; return; }
  if (!drag) return;
  if (Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 6) drag.moved=true;
  if (drag.painting){ paintAt(e.clientX, e.clientY); return; }
  if (drag.moved){ S.cam.x -= (e.clientX-drag.lx)/S.cam.z; S.cam.y -= (e.clientY-drag.ly)/S.cam.z; S.follow=false; }
  drag.lx=e.clientX; drag.ly=e.clientY;
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size<2) pinch=null;
  if (drag && !drag.moved && !drag.painting && e.type==="pointerup") clickAt(e.clientX, e.clientY, e.pointerType);
  if (pointers.size===0) drag=null;
}
cvs.addEventListener("pointerup", endPointer); cvs.addEventListener("pointercancel", endPointer);
function paintAt(sx, sy){
  const w=screenToWorld(sx,sy); const t=tileAt(w.x,w.y); if (!inMap(t.x,t.y)) return;
  const i=t.y*W+t.x; if (!roadTileOk(i) || S.place.tiles.has(i)) return;
  if ((S.place.tiles.size+1)*ROAD_PRICE > S.me.credits){ return; }
  S.place.tiles.add(i); renderPlacebar();
}
function clickAt(sx, sy, ptype){
  const w=screenToWorld(sx,sy);
  if (S.place && S.place.type){
    const t=TYPES[S.place.type]; const gx=Math.round(w.x/T-t.size[0]/2), gy=Math.round(w.y/T-t.size[1]/2);
    if (ptype==="mouse" || (S.ghost && S.ghost.x===gx && S.ghost.y===gy)){ S.ghost={x:gx,y:gy}; placeBuilding(S.place.type,gx,gy); }
    else { S.ghost={x:gx,y:gy}; renderPlacebar(); }
    return;
  }
  if (!S.playing) return;
  const tt=tileAt(w.x,w.y);
  if (inMap(tt.x,tt.y) && occ[tt.y*W+tt.x]>=0){ const b=S.buildings[occ[tt.y*W+tt.x]]; S.target=door(b); }
  else S.target={x:w.x, y:w.y};
  S.follow=true; if (S.task){ S.task=null; lastCardKey=""; }
}
mini.addEventListener("click", e=>{ const r=mini.getBoundingClientRect(); S.cam.x=(e.clientX-r.left)/r.width*WORLD; S.cam.y=(e.clientY-r.top)/r.height*WORLD; S.follow=false; if (S.cam.z<.6) S.cam.z=1; });

/* ============================================================
   LOOP
   ============================================================ */
let last=performance.now(), creditAcc=0, presAcc=0, peopleAcc=0, lastPres="";
function tick(nowP){
  const dt=Math.min(.1,(nowP-last)/1000); last=nowP;
  const now=Date.now();
  if (S.playing){
    // movement
    let vx=0, vy=0; const k=S.keys;
    if (k.a||k.arrowleft) vx-=1; if (k.d||k.arrowright) vx+=1; if (k.w||k.arrowup) vy-=1; if (k.s||k.arrowdown) vy+=1;
    const speed = (k.shift?170:95);
    if ((vx||vy) && S.task){ S.task=null; lastCardKey=""; }
    if (!vx && !vy && S.target){ const dx=S.target.x-S.pos.x, dy=S.target.y-S.pos.y, d=Math.hypot(dx,dy); if (d<2) S.target=null; else { vx=dx/d; vy=dy/d; } }
    else if (vx&&vy){ vx*=.7071; vy*=.7071; }
    if (vx||vy){
      const nx=S.pos.x+vx*speed*dt, ny=S.pos.y+vy*speed*dt;
      const okX = !blocked(nx, S.pos.y), okY = !blocked(S.pos.x, ny);
      if (okX) S.pos.x=nx; if (okY) S.pos.y=ny;
      if (!okX && !okY) S.target=null;
    }
    if (S.follow){ S.cam.x += (S.pos.x-S.cam.x)*Math.min(1,dt*6); S.cam.y += (S.pos.y-S.cam.y)*Math.min(1,dt*6); }
    // task
    if (S.task && performance.now()-S.task.start >= S.task.secs*1000) finishTask();
    // passive credits: 1 per second while the page is visible
    if (document.visibilityState==="visible"){ creditAcc+=dt; if (creditAcc>=1){ const n=Math.floor(creditAcc); creditAcc-=n; S.me.credits+=n; S.me.earned=(S.me.earned||0)+n; dirty=true; } }
    $("credits").textContent=fmt(S.me.credits);
    // presence
    presAcc+=dt;
    if (S.room && presAcc>.1){ presAcc=0;
      const act = S.task ? TYPES[S.task.b.type].verb+" at "+TYPES[S.task.b.type].name : null;
      const walking = !!(S.target||anyKey());
      const sig = Math.round(S.pos.x)+","+Math.round(S.pos.y)+","+act+","+walking;
      if (sig!==lastPres){ lastPres=sig; S.room.presence({pid:S.uid, x:Math.round(S.pos.x), y:Math.round(S.pos.y), act, walking}).catch(()=>{}); }
    }
    renderCard(false);
  }
  const gt=gameTime(now); const hh=Math.floor(gt.frac*24), mm=Math.floor((gt.frac*24-hh)*60);
  $("clock").textContent="Day "+gt.day+" · "+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
  peopleAcc+=dt; if (peopleAcc>1){ peopleAcc=0; renderPeople(now); }
  draw(now);
  requestAnimationFrame(tick);
}
function blocked(wx, wy){ const t=tileAt(wx,wy); if (!inMap(t.x,t.y)) return true; return water[t.y*W+t.x]===1; }

/* ============================================================
   LOGIN + DATA
   ============================================================ */
let pickedColor = COLORS[0];
function renderLogin(state){
  const box=$("loginBody"); box.textContent="";
  if (state==="loading"){ box.append(el("p",null,"Opening the town…")); return; }
  if (state==="readonly"){
    box.append(el("p",null,"You can watch the town, but your access to this page is view-only, so you can't add a character. Ask the owner to share it with you as a Contributor."),
      el("div",{class:"row-end"}, el("button",{class:"btn", onclick:()=>{$("login").hidden=true;}}, "Watch the town")));
    return;
  }
  if (S.me && S.me.name){
    box.append(el("p",null,"Welcome back. "+S.me.name+" has been busy while you were away."),
      el("div",{class:"meta"}, el("span",{class:"tag"}, fmt(S.me.credits)+" credits"), el("span",{class:"tag"}, (S.me.tasks||0)+" activities done")),
      S.solo ? el("p",{class:"hint"}, "Practice mode: the shared town isn't reachable from here, so progress stays in this browser only.") : null,
      el("div",{class:"row-end"}, el("button",{class:"btn gold", id:"enterBtn", onclick:enterGame}, "Take control of "+S.me.name)));
    return;
  }
  const form = el("form",{style:"display:grid;gap:12px"});
  const input = el("input",{type:"text", id:"charName", maxlength:"18", placeholder:"e.g. Nim", autocomplete:"off", required:""});
  const sw = el("div",{class:"swatches", role:"group", "aria-label":"Shirt colour"});
  COLORS.forEach(c=>sw.append(el("button",{type:"button", style:"background:"+c, "aria-label":"Colour "+c, "aria-pressed":String(c===pickedColor), onclick:()=>{ pickedColor=c; [...sw.children].forEach((b,i)=>b.setAttribute("aria-pressed", String(COLORS[i]===c))); }})));
  form.append(el("label",{for:"charName"},"Your character's name"), input, el("label",null,"Shirt colour"), sw,
    S.solo ? el("p",{class:"hint"}, "Practice mode: the shared town isn't reachable from here, so this character lives in this browser only.") : el("p",{class:"hint"}, "You start with "+START_CREDITS+" credits and earn 1 more every second you're here."),
    el("div",{class:"row-end"}, el("button",{class:"btn gold", type:"submit"}, "Move in")));
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    const name = input.value.trim().replace(/\s+/g," ").slice(0,18);
    if (!name){ input.focus(); return; }
    S.me = {name, color:pickedColor, credits:START_CREDITS, earned:0, tasks:0, home:null, created:Date.now()};
    if (S.uid) S.players[S.uid]=S.me;
    dirty=true; flush();
    try { await S.saveChain; } catch(e){}
    enterGame();
  });
  box.append(form);
  setTimeout(()=>input.focus(), 50);
}
function enterGame(){
  $("login").hidden=true;
  S.playing=true;
  const st = autoState(S.uid||"solo", homeOf(S.uid, S.me), Date.now());
  S.pos={x:st.x, y:st.y}; S.cam.x=S.pos.x; S.cam.y=S.pos.y; S.cam.z=Math.max(S.cam.z,1.6); S.follow=true;
  $("meChip").hidden=false; $("shopBtn").hidden=false; $("roadBtn").hidden=false;
  $("meName").textContent=S.me.name; $("meDot").style.background=safeColor(S.me.color);
  const m=$("mode"); m.hidden=false;
  m.textContent = (matchMedia("(pointer:coarse)").matches ? "Tap to walk. Tap a building to go in. Pinch to zoom." : "WASD or click to walk · Shift to run · E to do the activity · B for the shop");
  setTimeout(()=>{ m.hidden=true; }, 12000);
  toast("Welcome to town, "+S.me.name);
}

async function boot(){
  setBuildings([]); rebuildRoads();
  requestAnimationFrame(tick);
  renderLogin("loading");
  const [db, user, room] = await Promise.all(["db","user","room"].map(n => (window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null)).catch(()=>null)));
  S.user=user;
  const uid = user ? await user.id() : null;
  if (!db || !uid){ startSolo(); return; }
  S.db=db; S.uid=uid; S.solo=false;
  const canW = user ? await user.can("data.write") : null;
  if (canW===false) S.canWrite=false;
  if (room){ S.room=room; wireRoom(room); }
  // live data
  let firstPlayers=false;
  const timer=setTimeout(()=>{ if (!firstPlayers){ S.dataNote="The shared town hasn't answered yet, so what you see may be out of date."; toast("Still connecting to the shared town…"); } }, 10000);
  db.collection("players").onSnapshot(snap=>{
    const next={};
    for (const d of snap.docs){ const v=d.data(); if (v && typeof v.name==="string") next[d.id]={name:v.name.slice(0,18), color:safeColor(v.color), credits:+v.credits||0, earned:+v.earned||0, tasks:+v.tasks||0, home:v.home&&Number.isFinite(v.home.x)?{x:v.home.x,y:v.home.y}:null, created:v.created}; }
    if (S.me && S.playing) next[S.uid]=S.me;
    S.players=next;
    destCache=new Map();
    if (!snap.metadata.fromCache && !firstPlayers){
      firstPlayers=true; clearTimeout(timer); S.dataNote="";
      if (!S.me && next[S.uid]) S.me=Object.assign({}, next[S.uid]);
      if (S.me && S.uid) S.players[S.uid]=S.me;
      if (!S.playing) renderLogin(S.canWrite || S.me ? "ready" : "readonly");
    }
  }, err=>{ clearTimeout(timer); if (!S.playing) startSolo(); });
  db.collection("buildings").onSnapshot(snap=>{
    setBuildings(snap.docs.map(d=>Object.assign({id:d.id}, d.data())));
    lastCardKey="";
  }, ()=>{});
  db.collection("roads").onSnapshot(snap=>{
    const r={}; for (const d of snap.docs){ const v=d.data(); if (v && Array.isArray(v.t)) r[d.id]=v.t.filter(n=>Number.isInteger(n)&&n>=0&&n<CH*CH); }
    S.dbRoads=r; rebuildRoads();
  }, ()=>{});
}
function startSolo(){
  S.solo=true; S.db=null; S.uid=null;
  loadSolo();
  S.me = soloState.me ? Object.assign({}, soloState.me) : null;
  S.dbRoads = soloState.roads||{}; rebuildRoads();
  setBuildings(soloState.buildings||[]);
  S.uid = "solo";
  if (S.me) S.players.solo=S.me;
  renderLogin("ready");
}
function wireRoom(room){
  room.onPeers(ch=>{
    const now=Date.now();
    for (const p of ch.peers){
      if (p.sameTab) continue;
      const pr=p.presence||{}; const id = p.by || (typeof pr.pid==="string"?pr.pid:null);
      if (!id || !Number.isFinite(pr.x) || !Number.isFinite(pr.y)) continue;
      S.online[id]={x:Math.max(0,Math.min(WORLD,pr.x)), y:Math.max(0,Math.min(WORLD,pr.y)), act: typeof pr.act==="string"?pr.act.slice(0,60):null, walking:!!pr.walking, seen:now};
    }
    for (const p of ch.left){ const id=p.by || (p.presence&&p.presence.pid); if (id && S.online[id]) delete S.online[id]; }
  }, ()=>{});
  // keep "seen" fresh for peers that are idle but still here
  setInterval(()=>{ const now=Date.now(); for (const p of room.peers()){ if (p.sameTab) continue; const id=p.by||(p.presence&&p.presence.pid); if (id && S.online[id]) S.online[id].seen=now; } }, 5000);
}
// A quick sanity pass so the scene opens on the town even before login
S.cam.z = 1.2;
boot();
</script>
